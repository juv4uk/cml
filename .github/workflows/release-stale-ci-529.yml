name: Release stale CML runner occupancy

on:
  push:
    branches:
      - ops/release-stale-ci-529

# Deliberately collide with the obsolete merged PR #529 CI concurrency group.
# GitHub's control plane cancels that stale in-progress run before scheduling
# this tiny trusted no-op. Remove this one-shot branch after requalification.
concurrency:
  group: CI-refs/pull/528/merge
  cancel-in-progress: true

jobs:
  release:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "controller-only concurrency cancellation"
