name: Sync sens language contract

on:
  schedule:
    - cron: "11 4 * * *"
  workflow_dispatch: {}
  push:
    branches: [master]
    paths:
      - ".github/workflows/sync-my-lisp-contract.yml"
  pull_request:
    paths:
      - "contracts/my-lisp/**"
      - ".github/workflows/sync-my-lisp-contract.yml"

jobs:
  sync:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, guix]
    permissions:
      contents: write
    env:
      UPSTREAM_CLONE: /home/agents/GitHub/sens
      UPSTREAM_REF: origin/main
      UPSTREAM_PATH: language-contract.lisp
      TARGET_PATH: contracts/my-lisp/language-contract.lisp
      LOCK_PATH: contracts/my-lisp/lock.lisp
    steps:
      - name: Check out consumer default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Observe exact sens contract revision
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          test -d "$UPSTREAM_CLONE/.git"

          git -C "$UPSTREAM_CLONE" fetch --quiet origin main
          contract_revision="$(
            git -C "$UPSTREAM_CLONE" log -1 --format=%H "$UPSTREAM_REF" -- "$UPSTREAM_PATH"
          )"
          [[ "$contract_revision" =~ ^[0-9a-f]{40}$ ]]

          mkdir -p "$(dirname "$TARGET_PATH")" "$(dirname "$LOCK_PATH")"
          git -C "$UPSTREAM_CLONE" show "${contract_revision}:${UPSTREAM_PATH}" > "$TARGET_PATH"

          digest="$(sha256sum "$TARGET_PATH" | awk '{print $1}')"
          cat > "$LOCK_PATH" <<EOF
          ; Generated by juv4uk/sens/.github/workflows/sync-language-contract.yml
          ; This pins the observed upstream authority. It does NOT claim that the
          ; consumer implements the pinned contract version.
          (contract-lock
            (source
              (repository juv4uk/sens)
              (branch main)
              (path language-contract.lisp))
            (revision "${contract_revision}")
            (sha256 "${digest}"))
          EOF

          actual_digest="$(sha256sum "$TARGET_PATH" | awk '{print $1}')"
          test "$actual_digest" = "$digest"
          git -C "$UPSTREAM_CLONE" show "${contract_revision}:${UPSTREAM_PATH}" > /tmp/language-contract.lisp
          cmp --silent "$TARGET_PATH" /tmp/language-contract.lisp

          if [ -n "$(git status --porcelain -- "$TARGET_PATH" "$LOCK_PATH")" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "contract_revision=${contract_revision}" >> "$GITHUB_OUTPUT"

      - name: Commit passive snapshot to consumer default branch
        if: steps.sync.outputs.changed == 'true'
        env:
          CONTRACT_REVISION: ${{ steps.sync.outputs.contract_revision }}
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.repository.default_branch }}"
          test -n "$base"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET_PATH" "$LOCK_PATH"
          git commit -m "chore(contract): observe sens contract ${CONTRACT_REVISION}"
          git push origin "HEAD:refs/heads/${base}"

  verify:
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, guix]
    permissions:
      contents: read
    env:
      UPSTREAM_CLONE: /home/agents/GitHub/sens
      UPSTREAM_PATH: language-contract.lisp
      TARGET_PATH: contracts/my-lisp/language-contract.lisp
      LOCK_PATH: contracts/my-lisp/lock.lisp
    steps:
      - name: Check out consumer repository
        uses: actions/checkout@v4

      - name: Verify digest and exact pinned sens source
        shell: bash
        run: |
          set -euo pipefail
          test -f "$TARGET_PATH"
          test -f "$LOCK_PATH"
          test -d "$UPSTREAM_CLONE/.git"

          revision="$(awk -F'"' '/\(revision "/ {print $2; exit}' "$LOCK_PATH")"
          locked_digest="$(awk -F'"' '/\(sha256 "/ {print $2; exit}' "$LOCK_PATH")"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          [[ "$locked_digest" =~ ^[0-9a-f]{64}$ ]]

          git -C "$UPSTREAM_CLONE" fetch --quiet origin main
          git -C "$UPSTREAM_CLONE" cat-file -e "${revision}^{commit}"

          actual_digest="$(sha256sum "$TARGET_PATH" | awk '{print $1}')"
          test "$actual_digest" = "$locked_digest"

          git -C "$UPSTREAM_CLONE" show "${revision}:${UPSTREAM_PATH}" > /tmp/language-contract.lisp
          cmp --silent "$TARGET_PATH" /tmp/language-contract.lisp
