name: CML modern exact-domain transport candidate
on:
  push:
    branches: [master]
    paths:
      - "integration/current-sens-transport/**"
      - "src/current_exact_optimizer.rs"
      - "src/current_exact_model.rs"
      - "src/core_profile.rs"
      - "tests/core_profile_request_test.rs"
      - ".github/workflows/current-sens-transport-candidate.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-modern-bridge:
    name: Build modern CML bridge with exact SENS candidate, no historical SID
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SENS_CANDIDATE_SHA: 390f313242b538cb954dc00afa32ef0003f7d94b
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: juv4uk/sens
          ref: 390f313242b538cb954dc00afa32ef0003f7d94b
          path: external/sens
          persist-credentials: false
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify candidate SHA, physical fixture and unchanged production gitlink
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C external/sens rev-parse HEAD)" = "$SENS_CANDIDATE_SHA"
          test "$(od -An -tx1 external/sens/tests/fixtures/migration-quote-cohort-main/quote-legacy.sens | tr -d ' \n')" = 638906a1
          git ls-tree HEAD external/sens > "$RUNNER_TEMP/production-sens-gitlink.txt"
          test -s "$RUNNER_TEMP/production-sens-gitlink.txt"
          ! grep -Eq 'sens::sid|sens::Sid8|ExprKind::Sid' integration/current-sens-transport/src/lib.rs
      - name: Compile exact D3-D4 authority and both physical transports
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path integration/current-sens-transport/Cargo.toml \
            -- --nocapture 2>&1 | tee "$RUNNER_TEMP/modern-sens-transport.log"
          grep -q CML_MODERN_TRANSPORT_PASS "$RUNNER_TEMP/modern-sens-transport.log"
          grep -q CML_MODERN_DOMAIN_AUTHORITY_PASS "$RUNNER_TEMP/modern-sens-transport.log"
          grep -q CML_MODERN_REGISTRY_PASS "$RUNNER_TEMP/modern-sens-transport.log"
          grep -q CML_MODERN_IR_PARITY_PASS "$RUNNER_TEMP/modern-sens-transport.log"
          grep -q CML_SENS_OPTIMIZER_ORACLE_PASS "$RUNNER_TEMP/modern-sens-transport.log"
          grep -q CML_SENS_OPTIMIZER_AST_IR_INTEGRITY_PASS "$RUNNER_TEMP/modern-sens-transport.log"
          grep -q CML_SENS_OPTIMIZER_PHYSICAL_REPLAY_PASS "$RUNNER_TEMP/modern-sens-transport.log"
          grep -q CML_SENS_OPTIMIZER_PHYSICAL_REPLAY_FAIL_CLOSED_PASS "$RUNNER_TEMP/modern-sens-transport.log"
          grep -q "CML_SENS_OPTIMIZER_EXHAUSTIVE_QUOTE_ORACLE_PASS cases=32 rewrite_laws=2 datum_shapes=4" "$RUNNER_TEMP/modern-sens-transport.log"
          grep -q CML_SENS_OPTIMIZER_NO_UNPROVED_EAGER_REWRITE_PASS "$RUNNER_TEMP/modern-sens-transport.log"
          grep -q CML_ROOT_PHYSICAL_TO_IR_AUTHORITY_PASS "$RUNNER_TEMP/modern-sens-transport.log"
          grep -q CML_ROOT_CURRENT_COVERAGE_PASS "$RUNNER_TEMP/modern-sens-transport.log"
          grep -q CML_ROOT_CURRENT_COVERAGE_NATIVE_UNPROVEN_PASS "$RUNNER_TEMP/modern-sens-transport.log"
          grep -q CML_PRODUCTION_CORE_PROFILE_MODERN_PASS "$RUNNER_TEMP/modern-sens-transport.log"
          grep -q CML_PRODUCTION_PROFILE_WIDTH_COLLISION_REJECTED "$RUNNER_TEMP/modern-sens-transport.log"
          test "$(git rev-parse HEAD:external/sens)" != "$SENS_CANDIDATE_SHA"
          echo CML_MODERN_BRIDGE_EXACT_CANDIDATE_PASS
      - name: Exercise opt-in O1 compiler CLI with strict T5/F3 and digest failure
        shell: bash
        run: |
          set -euo pipefail
          manifest=integration/current-sens-transport/Cargo.toml
          sample=external/sens/tests/fixtures/migration-quote-cohort-main/quote-legacy.sens
          cargo run --manifest-path "$manifest" --quiet --bin optimize_exact -- \
            --t5 "$sample" | tee "$RUNNER_TEMP/sens-o1-t5.log"
          grep -q 'SENS_OPT_O1_CANDIDATE_PASS carrier=T5' "$RUNNER_TEMP/sens-o1-t5.log"
          python3 - "$RUNNER_TEMP/o1-quote.senc" <<'PY'
          import sys
          from pathlib import Path
          Path(sys.argv[1]).write_bytes(bytes([0xf3,0x40,0x60]))
          PY
          trusted=19b495e17cd0522c1af4863704b92751df5e5769ee0bfe3c9844aedbc0a57406
          cargo run --manifest-path "$manifest" --quiet --bin optimize_exact -- \
            --f3 "$RUNNER_TEMP/o1-quote.senc" "$trusted" \
            | tee "$RUNNER_TEMP/sens-o1-f3.log"
          grep -q 'SENS_OPT_O1_CANDIDATE_PASS carrier=F3' "$RUNNER_TEMP/sens-o1-f3.log"
          if cargo run --manifest-path "$manifest" --quiet --bin optimize_exact -- \
            --f3 "$RUNNER_TEMP/o1-quote.senc" "$(printf '0%.0s' {1..64})" >/dev/null 2>&1; then
            echo "BLOCK: optimizer admitted untrusted F3" >&2
            exit 1
          fi
          if cargo run --manifest-path "$manifest" --quiet --bin optimize_exact -- \
            --t5 "$RUNNER_TEMP/o1-quote.senc" >/dev/null 2>&1; then
            echo "BLOCK: optimizer guessed F3 as T5" >&2
            exit 1
          fi
          echo SENS_OPT_O1_CLI_FAIL_CLOSED_PASS
      - name: Execute actual root CML coverage CLI against SENS law, verify schema v2
        shell: bash
        run: |
          set -euo pipefail
          cargo run --manifest-path integration/current-sens-transport/Cargo.toml \
            --quiet --bin cml_coverage_current > "$RUNNER_TEMP/cml-current-coverage.tsv"
          python3 - "$RUNNER_TEMP/cml-current-coverage.tsv" <<'PY'
          from pathlib import Path
          import sys
          rows=Path(sys.argv[1]).read_text().splitlines()
          assert rows[0]=="schema\tcml-coverage/2", rows[0]
          assert "upstream-channel\tcurrent-sens-executable-compiler-law" in rows
          assert "compiler-role-identities\t9" in rows
          assert "x86-executable\t0" in rows
          assert "x86-assembly-witness-only\t0" in rows
          assert "x86-representation-limited\t0" in rows
          parsed=[line.split("\t") for line in rows if line.startswith("row\t")]
          assert len(parsed)==9
          assert sum(p[1].startswith("D3:") for p in parsed)==7
          assert sum(p[1].startswith("D4:") for p in parsed)==2
          assert all(len(p)==7 and p[3]=="source-admitted" and p[6]=="-" for p in parsed)
          print("CML_ROOT_CURRENT_COVERAGE_CLI_PASS schema_v2=true roles=9 native_unproven=true")
          PY
      - name: Build exact-domain consumer and verify ALL real T5 and selected F3 carriers
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path integration/current-sens-transport/Cargo.toml --bin verify_stage
          cargo build --locked --release --manifest-path external/sens/Cargo.toml \
            -p sens --example two_codec_small_programs
          (
            cd external/sens
            python3 scripts/prepare-two-codec-migration.py \
              --stage "$RUNNER_TEMP/cml-tiny-stage" \
              > "$RUNNER_TEMP/cml-tiny-manifest.json"
            python3 scripts/prepare-two-codec-migration.py \
              --verify-stage "$RUNNER_TEMP/cml-tiny-stage" \
              > "$RUNNER_TEMP/cml-tiny-audit.json"
          )
          python3 - "$RUNNER_TEMP/cml-tiny-manifest.json" "$RUNNER_TEMP/cml-tiny-stage" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          manifest=json.loads(Path(sys.argv[1]).read_text())
          stage=Path(sys.argv[2])
          executable=Path("integration/current-sens-transport/target/debug/verify_stage").resolve()
          root=Path("external/sens").resolve()
          t5_count=f3_count=ir_admitted=ir_unsupported=0
          for row in manifest["files"]:
              source=root / row["source"]
              subprocess.run([executable, "--t5", source], check=True)
              t5_count+=1
              if row["codec"] == "F3":
                  f3=stage / row["staged_file"]
                  accepted=subprocess.run([
                      executable,"--f3",source,f3,row["staged_sha256"]
                  ],check=True,text=True,capture_output=True)
                  print(accepted.stdout.strip())
                  if "ir=ADMITTED" in accepted.stdout and "eval=EQUAL" in accepted.stdout:
                      ir_admitted+=1
                  elif "ir=UNSUPPORTED" in accepted.stdout:
                      ir_unsupported+=1
                  else:
                      raise SystemExit(f"missing typed AST/IR result: {f3}")
                  # Every real F3 file must reject a wrong trusted digest,
                  # even when the payload itself remains physically decodable.
                  untrusted=subprocess.run(
                      [executable,"--f3",source,f3,"0"*64],
                      capture_output=True,text=True,check=False)
                  if untrusted.returncode == 0 or "Untrusted" not in untrusted.stderr and "rejected" not in untrusted.stderr:
                      raise SystemExit(f"unsafe digest handling for {f3}")
                  f3_count+=1
              elif row["codec"] != "T5":
                  raise SystemExit(f"unknown staged codec: {row['codec']}")
          if t5_count != manifest["source_files"] or t5_count != 23 or f3_count != 9:
              raise SystemExit(f"regressed full staged corpus: T5={t5_count} F3={f3_count}")
          if ir_admitted != f3_count or ir_unsupported != 0:
              raise SystemExit(f"typed IR admission proof insufficient: {ir_admitted}/{ir_unsupported}")
          print(f"CML_MODERN_STAGE_CORPUS_PASS source_t5={t5_count} selected_f3={f3_count} ir_admitted={ir_admitted} ir_unsupported={ir_unsupported}")
          PY
      - name: Preserve positive and negative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cml-modern-domain-transport-${{ github.sha }}
          path: |
            ${{ runner.temp }}/modern-sens-transport.log
            ${{ runner.temp }}/sens-o1-t5.log
            ${{ runner.temp }}/sens-o1-f3.log
            ${{ runner.temp }}/cml-current-coverage.tsv
            ${{ runner.temp }}/production-sens-gitlink.txt
            ${{ runner.temp }}/cml-tiny-manifest.json
            ${{ runner.temp }}/cml-tiny-audit.json
          if-no-files-found: warn
          retention-days: 30
