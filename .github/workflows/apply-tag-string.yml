name: Apply TAG_STRING to C backend

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-tag-string.yml'
      - 'evidence/semantic-ir-recovery/apply_tag_string.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        id: patch
        run: |
          set -euo pipefail
          python3 evidence/semantic-ir-recovery/apply_tag_string.py
          if git diff --quiet src/c_backend.rs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit
        if: steps.patch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/c_backend.rs
          git commit -m "feat(c-backend): TAG_STRING values (COMPILER-03)"
          git push origin HEAD:master
