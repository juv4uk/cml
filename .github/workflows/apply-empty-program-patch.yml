name: Apply empty-program NIL patch

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-empty-program-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch c_backend if needed
        id: patch
        run: |
          set -euo pipefail
          if grep -q 'printed_result' src/c_backend.rs; then
            echo "already_applied=true" >> "$GITHUB_OUTPUT"
            echo "already present"
            exit 0
          fi
          echo "already_applied=false" >> "$GITHUB_OUTPUT"
          python3 << 'PY'
          from pathlib import Path
          p = Path("src/c_backend.rs")
          t = p.read_text()
          needle = "        let mut main_body = String::new();\n        for ir in program {"
          if needle not in t:
              raise SystemExit("needle not found")
          insert = (
              "        let mut main_body = String::new();\n"
              "        // my-lisp empty-program semantics (TASK-001)\n"
              "        let mut printed_result = false;\n"
              "        for ir in program {"
          )
          t = t.replace(needle, insert, 1)
          # After the print_value format for non-def, set flag before closing other arm
          old_other_end = (
              '                        "    {{ Value *result = {expr}; print_value(result); printf(\\"\\\\n\\"); }}\\\\n"\n'
              "                    ));\n"
              "                }\n"
              "            }\n"
              "        }\n"
          )
          # More tolerant: find unique sequence after printf format close
          marker = "print_value(result); printf"
          idx = t.find(marker)
          if idx < 0:
              raise SystemExit("print_value marker missing")
          # Find the ")); following this format! within next 200 chars
          close = t.find("));", idx)
          if close < 0:
              raise SystemExit("close missing")
          # After ")); insert printed_result = true;
          insert_at = close + 3
          if "printed_result = true" not in t:
              t = t[:insert_at] + "\n                    printed_result = true;" + t[insert_at:]
          # Before Ok(format!( for compile_program main_body section - after for loop closing
          ok_marker = "\n        Ok(format!(\n            \"{RUNTIME}"
          # Find the for-loop end near compile_program
          cp = t.find("pub fn compile_program")
          region = t[cp:cp+2500]
          if "if !printed_result" not in region:
              # Insert before Ok(format! that uses main_body in compile_program
              target = "\n\n        Ok(format!(\n            \"{RUNTIME}\\n{}\\n\\nint main(void)"
              # try alternate
              alt = '        Ok(format!(\n            "{RUNTIME}\n{}\n\nint main(void)'
              pos = t.find(alt, cp)
              if pos < 0:
                  # find any Ok(format! after printed_result flag region
                  pos = t.find("        Ok(format!(", cp)
              if pos < 0:
                  raise SystemExit("Ok(format missing")
              block = (
                  "        if !printed_result {\n"
                  '            main_body.push_str("    { print_value(&NIL_V); printf(\\"\\\\n\\"); }\\\\n");\n'
                  "        }\n\n"
              )
              # careful: only once
              if "if !printed_result" not in t[cp:pos]:
                  t = t[:pos] + block + t[pos:]
          p.write_text(t)
          assert "printed_result" in p.read_text()
          print("patched ok")
          PY
      - name: Commit and push
        if: steps.patch.outputs.already_applied == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/c_backend.rs
          git diff --cached --stat
          git commit -m "fix(c-backend): empty program prints () (my-lisp TASK-001)"
          git push origin HEAD:master
