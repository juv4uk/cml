name: Reader Contract 4

on:
  push:
    branches: [master]
    paths:
      - "src/parser.rs"
      - "tests/reader_contract_test.rs"
      - ".github/workflows/reader-contract-4.yml"
  pull_request:
    paths:
      - "src/parser.rs"
      - "tests/reader_contract_test.rs"
      - ".github/workflows/reader-contract-4.yml"

# Historical provenance: the reader-4 invariant was ratified against
# my-lisp@67b6ab17222413af9bf671fee0d5a79217eb6d9a.
# That SHA is evidence history, NOT CML's supported-pin or observed-current.
# The executable check below is CML-local parser behavior; Cargo still needs
# the checked-in supported-pin submodule dependency initialized.
jobs:
  reader-contract-4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CML with supported-pin dependency
        uses: actions/checkout@v4
        with:
          path: cml
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prove apostrophe reader boundary
        working-directory: cml
        run: cargo test --test reader_contract_test
