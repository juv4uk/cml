name: Issue 608 current D1 backend carrier

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Hosted native Rust semantics; exact Guix-pure reproducibility is NOT certified here.
      - uses: dtolnay/rust-toolchain@stable
      - name: Require private dependency read token
        env:
          SENS_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
        run: test -n "$SENS_READ_TOKEN"

      - name: Checkout CML with pinned SENS
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
          submodules: true

      - name: Focused formatting
        run: >-
          
          rustfmt --edition 2024 --check
          src/c_backend.rs tests/current_d1_c_backend_test.rs

      - name: Current exact D1 carrier witness
        run: >-
          
          cargo test -p cml --test current_d1_c_backend_test -- --nocapture

      - name: Historical predicate carrier remains unchanged
        run: >-
          
          cargo test -p cml --test c_backend_test
          c_backend_current_predicates_return_upstream_record_domains -- --nocapture
