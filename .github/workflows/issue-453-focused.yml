name: Issue 453 compiler pass proof spine

on:
  pull_request:
    paths:
      - src/compiler_passes.rs
      - src/bin/cml-compile.rs
      - src/lib.rs
      - tests/compiler_pass_manifest_test.rs
      - tests/compiler_phase_profile_test.rs
      - tests/compiler_pass_differential_test.rs
      - .github/workflows/issue-453-focused.yml

jobs:
  focused:
    runs-on: [self-hosted, guix]
    timeout-minutes: 20
    steps:
      - name: Require private dependency read token
        env:
          SENS_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
        run: test -n "$SENS_READ_TOKEN"

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Rustfmt contract
        run: cargo fmt -p cml -- --check
      - name: Pass manifest invariants
        run: cargo test --lib compiler_passes::tests -- --nocapture
      - name: Machine-readable pass manifest
        run: cargo test --test compiler_pass_manifest_test -- --nocapture
      - name: Artifact-neutral phase profiling
        run: cargo test --test compiler_phase_profile_test -- --nocapture
      - name: Bounded SENS oracle to compiled differential
        run: cargo test --test compiler_pass_differential_test -- --nocapture
