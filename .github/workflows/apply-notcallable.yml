name: Apply NotCallable kind

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-notcallable.yml'
      - 'evidence/semantic-ir-recovery/apply_notcallable.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        id: patch
        run: |
          set -euo pipefail
          before=$(grep -c NotCallable src/c_backend.rs || true)
          python3 evidence/semantic-ir-recovery/apply_notcallable.py
          after=$(grep -c NotCallable src/c_backend.rs || true)
          if [ "$before" = "$after" ] && grep -q 'NotCallable' src/c_backend.rs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          # always true if we just patched from zero
          if git diff --quiet src/c_backend.rs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit
        if: steps.patch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/c_backend.rs
          git commit -m "fix(c-backend): NotCallable named error kind (COMPILER-05)"
          git push origin HEAD:master
