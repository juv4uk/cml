name: Issue 655 C1 artifact to C2 executable

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "external/sens"
      - "upstream-revisions.lisp"
      - "src/sens_rich_bridge.rs"
      - "src/sens_current_lowering.rs"
      - "src/sens_c1_artifact.rs"
      - "src/c_backend.rs"
      - ".github/workflows/issue-630-c1-driver.yml"
      - ".github/workflows/issue-648-selfhost-c2.yml"
      - ".github/workflows/issue-655-c2-executable.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c2-executable:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "1"
    steps:
      - name: Checkout exact C1/C2 lineage
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Freeze exact SENS verifier denominator
        run: |
          pin="$(grep -oE '\(supported-pin-sha \. "[0-9a-f]{40}"\)' upstream-revisions.lisp | grep -oE '[0-9a-f]{40}' | head -n1)"
          build_pin="$(grep -oE '\(build-source-sha \. "[0-9a-f]{40}"\)' upstream-revisions.lisp | grep -oE '[0-9a-f]{40}' | head -n1)"
          test -n "$pin"
          test "$build_pin" = "$pin"
          test "$(git -C external/sens rev-parse HEAD)" = "$pin"

      - name: Focused format
        run: rustfmt --edition 2024 --check src/sens_rich_bridge.rs src/sens_current_lowering.rs src/sens_c1_artifact.rs

      - name: C1 binary artifact materializes and runs C2 executable
        env:
          CML_PRODUCER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          cargo test -j 2 -p cml --lib
          sens_c1_artifact::tests::c1_binary_artifact_materializes_and_runs_distinct_c2_executable
          -- --nocapture --test-threads=1
