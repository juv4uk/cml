name: Issue 655 C1 artifact to C2 executable + Nano-SENS K1

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "external/sens"
      - "upstream-revisions.lisp"
      - "src/sens_rich_bridge.rs"
      - "src/sens_current_lowering.rs"
      - "src/sens_c1_artifact.rs"
      - "src/c_backend.rs"
      - ".github/workflows/issue-630-c1-driver.yml"
      - ".github/workflows/issue-648-selfhost-c2.yml"
      - ".github/workflows/issue-655-c2-executable.yml"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "external/sens"
      - "upstream-revisions.lisp"
      - "src/sens_rich_bridge.rs"
      - "src/sens_current_lowering.rs"
      - "src/sens_c1_artifact.rs"
      - "src/c_backend.rs"
      - ".github/workflows/issue-630-c1-driver.yml"
      - ".github/workflows/issue-648-selfhost-c2.yml"
      - ".github/workflows/issue-655-c2-executable.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c2-executable:
    strategy:
      fail-fast: false
      matrix:
        clean_run: [1, 2]
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WSM_NUCLEUS_ASM: ${{ github.workspace }}/wsm-my-lisp/asm/nucleus.s
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "1"
    steps:
      - name: Checkout exact C1/C2 lineage
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Checkout pinned WSM x86 nucleus witness
        uses: actions/checkout@v5
        with:
          repository: juv4uk/wsm-my-lisp
          ref: a6bd9747196f2d676ab6883cbb4b84c7fcfc6947
          path: wsm-my-lisp

      - name: Capture pinned bootstrap inputs and toolchain
        env:
          SENS_SELFHOST_ARTIFACT_DIR: ${{ runner.temp }}/nano-sens-selfhost-artifacts
        run: |
          mkdir -p "$SENS_SELFHOST_ARTIFACT_DIR"
          {
            echo "schema=seed-v0-input-inventory/1"
            echo "measurement_scope=bootstrap-runner-file-bytes-only"
            echo "cml_commit=$(git rev-parse HEAD)"
            echo "sens_commit=$(git -C external/sens rev-parse HEAD)"
            echo "wsm_my_lisp_commit=$(git -C wsm-my-lisp rev-parse HEAD)"
            echo "external_dependencies=rustc,cargo,gcc,ld,ubuntu-latest; excluded_from_seed_bytes"
            echo "git_metadata_policy=separately_measured_external_checkout_metadata; excluded_from_seed_bytes"
            git_file_bytes() { find "$1" -type f -printf '%s\n' | awk '{ sum += $1 } END { printf "%.0f", sum }'; }
            cml_gitdir="$(git rev-parse --absolute-git-dir)"
            sens_gitdir="$(git -C external/sens rev-parse --absolute-git-dir)"
            wsm_gitdir="$(git -C wsm-my-lisp rev-parse --absolute-git-dir)"
            echo "cml_git_metadata_regular_file_bytes=$(git_file_bytes "$cml_gitdir")"
            echo "sens_git_metadata_regular_file_bytes=$(git_file_bytes "$sens_gitdir")"
            echo "wsm_git_metadata_regular_file_bytes=$(git_file_bytes "$wsm_gitdir")"
            echo "git_metadata_note=filesystem regular-file lengths summed; not the source checkout byte total"
            
            echo "rustc:"
            rustc -Vv
            echo "cargo:"
            cargo -V
            echo "gcc_version=$(gcc -dumpfullversion -dumpversion)"
            echo "gcc_target=$(gcc -dumpmachine)"
            echo "linker:"
            ld --version | head -n 1
            echo "source_file_sha256:"
            sha256sum src/sens_c1_artifact.rs src/sens_current_lowering.rs src/sens_rich_bridge.rs external/sens/lib/compiler-nucleus.lisp external/sens/language-contract.lisp external/sens/knowledge/bija3-l1-l5-structure-projection.json wsm-my-lisp/asm/nucleus.s
          } > "$SENS_SELFHOST_ARTIFACT_DIR/bootstrap-input-manifest.txt"

      - name: Freeze exact SENS verifier denominator
        run: |
          pin="$(grep -oE '\(supported-pin-sha \. "[0-9a-f]{40}"\)' upstream-revisions.lisp | grep -oE '[0-9a-f]{40}' | head -n1)"
          build_pin="$(grep -oE '\(build-source-sha \. "[0-9a-f]{40}"\)' upstream-revisions.lisp | grep -oE '[0-9a-f]{40}' | head -n1)"
          test -n "$pin"
          test "$build_pin" = "$pin"
          test "$(git -C external/sens rev-parse HEAD)" = "$pin"

      - name: Capture active Cargo dependency graphs
        env:
          SENS_SELFHOST_ARTIFACT_DIR: ${{ runner.temp }}/nano-sens-selfhost-artifacts
        run: |
          root="$SENS_SELFHOST_ARTIFACT_DIR"
          cml_committed_lock_blob="$(git rev-parse HEAD:Cargo.lock)"
          sens_committed_lock_blob="$(git -C external/sens rev-parse HEAD:Cargo.lock)"
          # Cargo.lock now includes the SENS serde dependency closure; require exact pinning.
          cargo tree --locked --manifest-path Cargo.toml -p cml --edges normal,build,dev --prefix none > "$root/cml-active-cargo-tree.txt"
          (cd external/sens && cargo tree --locked -p xtask --edges normal,build --prefix none) > "$root/sens-xtask-active-cargo-tree.txt"
          cml_resolved_lock_blob="$(git hash-object Cargo.lock)"
          sens_resolved_lock_blob="$(git -C external/sens hash-object Cargo.lock)"
          git diff -- Cargo.lock > "$root/cml-cargo-lock-resolution.diff"
          test "$cml_committed_lock_blob" = "$cml_resolved_lock_blob"
          test "$sens_committed_lock_blob" = "$sens_resolved_lock_blob"
          {
            echo "schema=nano-sens-active-cargo-graphs/1"
            echo "cml_committed_lock_git_blob=$cml_committed_lock_blob"
            echo "cml_resolved_lock_git_blob=$cml_resolved_lock_blob"
            echo "cml_lock_changed_during_resolution=$([ "$cml_committed_lock_blob" = "$cml_resolved_lock_blob" ] && echo false || echo true)"
            echo "sens_committed_lock_git_blob=$sens_committed_lock_blob"
            echo "sens_resolved_lock_git_blob=$sens_resolved_lock_blob"
            echo "sens_lock_changed_during_resolution=$([ "$sens_committed_lock_blob" = "$sens_resolved_lock_blob" ] && echo false || echo true)"
            echo "cml_lock_sha256=$(sha256sum Cargo.lock | cut -d' ' -f1)"
            echo "sens_lock_sha256=$(sha256sum external/sens/Cargo.lock | cut -d' ' -f1)"
            sha256sum "$root/cml-active-cargo-tree.txt" "$root/sens-xtask-active-cargo-tree.txt" "$root/cml-cargo-lock-resolution.diff"
          } > "$root/active-cargo-graph-digests.txt"
          cat "$root/active-cargo-graph-digests.txt"
      - name: Pin CML compiler-source revision
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          if [ -n "$PR_HEAD_SHA" ]; then
            producer="$PR_HEAD_SHA"
          else
            producer="$(git log -1 --format=%H -- src/sens_c1_artifact.rs src/sens_current_lowering.rs src/sens_rich_bridge.rs)"
          fi
          test -n "$producer"
          echo "CML_PRODUCER_SHA=$producer" >> "$GITHUB_ENV"

      - name: Focused format
        run: rustfmt --edition 2024 --check src/sens_rich_bridge.rs src/sens_current_lowering.rs src/sens_c1_artifact.rs

      - name: C1 binary artifact materializes and runs C2 executable
        env:
          SENS_SELFHOST_ARTIFACT_DIR: ${{ runner.temp }}/nano-sens-selfhost-artifacts
        run: |
          cargo test -j 2 -p cml --lib \
            -- --nocapture --test-threads=1
          runner="$(find target/debug/deps -maxdepth 1 -type f -executable -name 'cml-*' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -n "$runner"
          cp "$runner" "$SENS_SELFHOST_ARTIFACT_DIR/seed-v0-c0-runner.bin"
          sha256sum "$SENS_SELFHOST_ARTIFACT_DIR/seed-v0-c0-runner.bin" >> "$SENS_SELFHOST_ARTIFACT_DIR/bootstrap-input-manifest.txt"
          {
            echo "external_runtime_shared_libraries:"
            ldd "$SENS_SELFHOST_ARTIFACT_DIR/seed-v0-c0-runner.bin" || true
          } >> "$SENS_SELFHOST_ARTIFACT_DIR/bootstrap-input-manifest.txt"

      - name: Build pinned lineage and measure seed-v0
        env:
          SENS_SELFHOST_ARTIFACT_DIR: ${{ runner.temp }}/nano-sens-selfhost-artifacts
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ["SENS_SELFHOST_ARTIFACT_DIR"])
          def raw(name):
              p = root / name
              assert p.is_file() and p.stat().st_size > 0, f"missing/empty required witness: {name}"
              return p.read_bytes()
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          def file_sha(path):
              return sha(Path(path).read_bytes())
          def command(*args):
              return subprocess.check_output(args, text=True).strip()

          c1_bin = raw("c1-executable.bin")
          c2_bin = raw("c2-executable.bin")
          c2_repeat_bin = raw("c2-repeat-executable.bin")
          c1_src = raw("c1-source.c")
          c2_src = raw("c2-source.c")
          c0_expected = raw("c0-expected-artifact.bin")
          c1_out = raw("c1-output-artifact.bin")
          c2_out = raw("c2-output-artifact.bin")
          raw("input-program.sw1")
          raw("seed-v0-c0-runner.bin")
          assert c1_bin == c2_bin == c2_repeat_bin, "C1/C2 executable bytes diverged"
          assert c1_src == c2_src, "C1/C2 generated C source bytes diverged"
          assert c0_expected == c1_out == c2_out, "C0/C1/C2 compiler-artifact bytes diverged"

          sens_rev = command("git", "-C", "external/sens", "rev-parse", "HEAD")
          cml_source_rev = command(
              "git", "log", "-1", "--format=%H", "--",
              "src/sens_c1_artifact.rs", "src/sens_current_lowering.rs", "src/sens_rich_bridge.rs"
          )
          target = command("gcc", "-dumpmachine")
          gcc_version = command("gcc", "-dumpfullversion", "-dumpversion")
          source = {
              "sens_source_sha": sens_rev,
              "compiler_nucleus_sha256": file_sha("external/sens/lib/compiler-nucleus.lisp"),
              "language_contract_sha256": file_sha("external/sens/language-contract.lisp"),
              "structural_law_projection_sha256": file_sha(
                  "external/sens/knowledge/bija3-l1-l5-structure-projection.json"
              ),
          }
          c1_sha, c2_sha = sha(c1_bin), sha(c2_bin)
          c1_src_sha, c2_src_sha = sha(c1_src), sha(c2_src)
          c1_out_sha, c2_out_sha = sha(c1_out), sha(c2_out)
          report = {
              "schema": "compiler-selfhost-lineage-report/1",
              "status": "pass",
              "source": source,
              "c0": {
                  "implementation_sha": cml_source_rev,
                  "cml_sha": cml_source_rev,
                  "backend": "CML Rust bootstrap + GCC C execution",
                  "target": target,
                  "abi_profile": "SW1+compiler-evidence-canonical/1",
              },
              "fresh_bootstrap": {
                  "preexisting_c1_read": False,
                  "preexisting_c2_read": False,
                  "c0_produced_c1": True,
                  "c1_produced_c2": True,
              },
              "generations": {
                  "c1": {
                      "produced": True, "executable": True,
                      "artifact_sha256": c1_sha, "normalized_sha256": c1_src_sha,
                  },
                  "c2": {
                      "produced": True, "executable": True,
                      "artifact_sha256": c2_sha, "normalized_sha256": c2_src_sha,
                  },
              },
              "equivalence": {
                  "attempts": [
                      {"method": "byte-identical-artifact", "status": "pass", "reason": None},
                      {"method": "normalized-ir-or-artifact-identical", "status": "unavailable",
                       "reason": "The stronger byte-identical criterion passed."},
                      {"method": "canonical-lowering-and-executable-corpus-identical", "status": "unavailable",
                       "reason": "A complete GAS/NASM golden corpus was not run by this witness."},
                  ],
                  "selected_method": "byte-identical-artifact",
              },
              "d8_admitted": False,
              "legacy_core1_sid8_substitution": False,
              "failure_category": None,
              "evidence": {
                  "cml_source_revision": cml_source_rev,
                  "gcc_version": gcc_version,
                  "gcc_target": target,
                  "c1_c_source_sha256": c1_src_sha,
                  "c2_c_source_sha256": c2_src_sha,
                  "c1_executable_sha256": c1_sha,
                  "c2_executable_sha256": c2_sha,
                  "c1_executable_size": len(c1_bin),
                  "c1_output_sha256": c1_out_sha,
                  "c2_output_sha256": c2_out_sha,
                  "c0_expected_artifact_sha256": sha(c0_expected),
                  "source_equivalence": "byte-identical",
                  "executable_equivalence": "byte-identical",
                  "output_equivalence": "byte-identical",
                  "c2_repeat_executable_sha256": sha(c2_repeat_bin),
              },
          }
          (root / "compiler-selfhost-lineage-report.json").write_text(
              json.dumps(report, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          print("FRESH_C0_C1_C2_LINEAGE_REPORT=PASS")
          PY
          git -C external/sens rev-parse HEAD > "$SENS_SELFHOST_ARTIFACT_DIR/sens-source-revision.txt"
          git rev-parse HEAD > "$SENS_SELFHOST_ARTIFACT_DIR/cml-workflow-head.txt"

      - name: Checkout pinned Nano-SENS measurement validators
        uses: actions/checkout@v5
        with:
          repository: juv4uk/sens
          ref: 2f66fc07e1900d0bffa0847757f3498645303e76
          path: nano-sens-measure-tools

      - name: Validate lineage and measure seed-v0
        env:
          SENS_SELFHOST_ARTIFACT_DIR: ${{ runner.temp }}/nano-sens-selfhost-artifacts
        run: |
          root="$SENS_SELFHOST_ARTIFACT_DIR"
          python3 nano-sens-measure-tools/scripts/validate-compiler-selfhost-lineage.py "$root/compiler-selfhost-lineage-report.json"
          python3 nano-sens-measure-tools/scripts/measure-nano-sens-size.py --self-test
          toolchain="$(rustc -Vv | tr '\n' ';') | cargo=$(cargo -V) | gcc=$(gcc -dumpfullversion -dumpversion) | ld=$(ld --version | head -n 1)"
          python3 nano-sens-measure-tools/scripts/measure-nano-sens-size.py \
            --seed "$root/seed-v0-c0-runner.bin" \
            --seed-role "Operational seed-v0: pinned CML lib-test bootstrap runner that produces C1 and runs C1/C2; includes Rust host/bootstrap compiler code; not a minimum-size claim" \
            --c1-executable "$root/c1-executable.bin" \
            --c2-executable "$root/c2-executable.bin" \
            --c1-static-executable "$root/c1-static-executable.bin" \
            --c1-static-output "$root/c1-static-output-artifact.bin" \
            --baseline-c1-output "$root/c1-output-artifact.bin" \
            --lineage-report "$root/compiler-selfhost-lineage-report.json" \
            --source-revision "$(git -C external/sens rev-parse HEAD)" \
            --toolchain "$toolchain" \
            --target "$(gcc -dumpmachine)" \
            --abi-profile "SW1+compiler-evidence-canonical/1" \
            --build-command "C1/C2 baseline: GCC -Wl,--build-id=none -s; K1: GCC -static -Wl,--build-id=none -s; full CML library corpus passed; baseline and static C1 outputs compared byte-for-byte" \
            --out "$root/nano-sens-size-report.json"

      - name: Preserve selfhost lineage artifacts for 30 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nano-sens-selfhost-c2-executable-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.clean_run }}
          path: ${{ runner.temp }}/nano-sens-selfhost-artifacts/
          retention-days: 30
          if-no-files-found: error

  compare-two-clean-runs:
    needs: c2-executable
    runs-on: ubuntu-latest
    steps:
      - name: Download the two 30-day evidence bundles
        uses: actions/download-artifact@v4
        with:
          pattern: nano-sens-selfhost-c2-executable-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: artifacts
          merge-multiple: false

      - name: Require two independent clean runs to agree byte-for-byte
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          paths = sorted(Path("artifacts").glob("*/nano-sens-size-report.json"))
          assert len(paths) == 2, f"expected exactly two fresh-run reports, got {len(paths)}"
          raw = [p.read_bytes() for p in paths]
          reports = [json.loads(b) for b in raw]
          assert all(r.get("schema") == "nano-sens-size-report/1" for r in reports)
          assert all(r.get("status") == "MEASURED_WITH_PINNED_SELFHOST_LINEAGE" for r in reports)
          assert raw[0] == raw[1], "two clean-run Nano-SENS reports differ byte-for-byte"
          result = {
              "schema": "nano-sens-two-clean-runs-proof/1",
              "status": "PASS",
              "clean_runs": 2,
              "identical_report_sha256": hashlib.sha256(raw[0]).hexdigest(),
              "seed_sha256": reports[0]["seed_artifact"]["sha256"],
              "seed_file_bytes": reports[0]["seed_artifact"]["file_bytes"],
              "c1_executable_sha256": reports[0]["c1_executable"]["sha256"],
              "c1_executable_file_bytes": reports[0]["c1_executable"]["file_bytes"],
              "c2_executable_sha256": reports[0]["c2_executable"]["sha256"],
              "c2_executable_file_bytes": reports[0]["c2_executable"]["file_bytes"],
              "pinned_sens_source_sha": reports[0]["source"]["sens_source_sha"],
              "pinned_lineage_report_sha256": reports[0]["source"]["lineage_report_sha256"],
              "report_paths": [str(p) for p in paths],
          }
          # The active dependency graph is separate from the whole Cargo.lock
          # feature universe. Require the same graph in both clean runs.
          graph_proof = {}
          for name in ("cml-active-cargo-tree.txt", "sens-xtask-active-cargo-tree.txt", "active-cargo-graph-digests.txt"):
              graph_paths = sorted(Path("artifacts").glob(f"*/{name}"))
              assert len(graph_paths) == 2, f"expected graph artifact {name} in both runs, got {len(graph_paths)}"
              graph_raw = [p.read_bytes() for p in graph_paths]
              assert graph_raw[0] == graph_raw[1], f"active Cargo graph differs between clean runs: {name}"
              graph_proof[name] = hashlib.sha256(graph_raw[0]).hexdigest()
          result["active_cargo_graphs"] = {"schema": "nano-sens-active-cargo-graphs/1", "byte_identical_across_runs": True, "sha256": graph_proof}
          Path("nano-sens-two-clean-runs-proof.json").write_text(
              json.dumps(result, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(result, sort_keys=True))
          PY

      - name: Preserve two-run measurement proof for 30 days
        uses: actions/upload-artifact@v4
        with:
          name: nano-sens-seed-v0-two-clean-runs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            nano-sens-two-clean-runs-proof.json
            artifacts/*/compiler-selfhost-lineage-report.json
            artifacts/*/nano-sens-size-report.json
            artifacts/*/bootstrap-input-manifest.txt
          retention-days: 30
          if-no-files-found: error
