name: Issue 648 C1 to C2 fixed-point witness

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "external/sens"
      - "upstream-revisions.lisp"
      - "src/c1_driver_runtime.rs"
      - "src/c_backend.rs"
      - "src/sens_c1_artifact.rs"
      - "src/sens_current_lowering.rs"
      - "src/sens_rich_bridge.rs"
      - ".github/workflows/issue-648-selfhost-c2.yml"
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "external/sens"
      - "upstream-revisions.lisp"
      - "src/c1_driver_runtime.rs"
      - "src/c_backend.rs"
      - "src/sens_c1_artifact.rs"
      - "src/sens_current_lowering.rs"
      - "src/sens_rich_bridge.rs"
      - ".github/workflows/issue-648-selfhost-c2.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  c2-witness:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    # CPU-only fixed-point proof; do not queue on the disabled local GPU runner.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "1"
    steps:
      - name: Checkout exact C1/C2 lineage
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Capture pinned bootstrap inputs and toolchain
        env:
          SENS_SELFHOST_ARTIFACT_DIR: ${{ runner.temp }}/nano-sens-selfhost-artifacts
        run: |
          mkdir -p "$SENS_SELFHOST_ARTIFACT_DIR"
          {
            echo "schema=seed-v0-input-inventory/1"
            echo "measurement_scope=bootstrap-runner-file-bytes-only"
            echo "cml_commit=$(git rev-parse HEAD)"
            echo "sens_commit=$(git -C external/sens rev-parse HEAD)"
            echo "external_dependencies=rustc,cargo,gcc,ld,ubuntu-latest; excluded_from_seed_bytes"
            echo "rustc:"
            rustc -Vv
            echo "cargo:"
            cargo -V
            echo "gcc_version=$(gcc -dumpfullversion -dumpversion)"
            echo "gcc_target=$(gcc -dumpmachine)"
            echo "linker:"
            ld --version | head -n 1
            echo "source_file_sha256:"
            sha256sum src/sens_c1_artifact.rs src/sens_current_lowering.rs src/sens_rich_bridge.rs external/sens/lib/compiler-nucleus.lisp external/sens/language-contract.lisp external/sens/knowledge/bija3-l1-l5-structure-projection.json
          } > "$SENS_SELFHOST_ARTIFACT_DIR/bootstrap-input-manifest.txt"

      - name: Freeze exact SENS denominator
        run: |
          pin="$(grep -oE '\(supported-pin-sha \. "[0-9a-f]{40}"\)' upstream-revisions.lisp | grep -oE '[0-9a-f]{40}' | head -n1)"
          build_pin="$(grep -oE '\(build-source-sha \. "[0-9a-f]{40}"\)' upstream-revisions.lisp | grep -oE '[0-9a-f]{40}' | head -n1)"
          test -n "$pin"
          test "$build_pin" = "$pin"
          test "$(git -C external/sens rev-parse HEAD)" = "$pin"

      - name: Focused format
        run: >-
          rustfmt --edition 2024 --check
          src/sens_c1_artifact.rs
          src/sens_current_lowering.rs
          src/sens_rich_bridge.rs

      - name: C1 recompiles identical nucleus to deterministic C2
        env:
          CML_PRODUCER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SENS_SELFHOST_ARTIFACT_DIR: ${{ runner.temp }}/nano-sens-selfhost-artifacts
        run: |
          cargo test -j 2 -p cml --lib \
            sens_c1_artifact::tests::c1_recompiles_identical_nucleus_to_byte_identical_c2_artifact \
            -- --nocapture --test-threads=1
          runner="$(find target/debug/deps -maxdepth 1 -type f -executable -name 'cml-*' -printf '%T@ %p\\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -n "$runner"
          cp "$runner" "$SENS_SELFHOST_ARTIFACT_DIR/seed-v0-c0-runner.bin"
          sha256sum "$SENS_SELFHOST_ARTIFACT_DIR/seed-v0-c0-runner.bin" >> "$SENS_SELFHOST_ARTIFACT_DIR/bootstrap-input-manifest.txt"

      - name: Preserve selfhost lineage artifacts for 30 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nano-sens-selfhost-c2-witness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nano-sens-selfhost-artifacts/
          retention-days: 30
          if-no-files-found: error
