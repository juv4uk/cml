name: Issue 563 exact-Q C baseline

on:
  pull_request:
    paths:
      - tests/exact_q_c_rep_baseline_test.rs
      - .github/workflows/issue-563-exact-q-c-baseline.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require private dependency read token
        env:
          SENS_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
        run: test -n "$SENS_READ_TOKEN"

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Focused formatting
        run: rustfmt --edition 2024 --check tests/exact_q_c_rep_baseline_test.rs

      - name: C exact-Q representation baseline
        run: cargo test --test exact_q_c_rep_baseline_test -- --nocapture
