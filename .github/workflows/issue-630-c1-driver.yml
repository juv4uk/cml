name: Issue 630 executable C1 driver
# canonical #630 driver gate; prerequisite audits are manual-only.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "external/sens"
      - "upstream-revisions.lisp"
      - "src/c1_driver_runtime.rs"
      - "src/c_backend.rs"
      - "src/sens_c1_artifact.rs"
      - "src/sens_current_lowering.rs"
      - "src/sens_rich_bridge.rs"
      - "tests/current_sens_c0_lowering_test.rs"
      - ".github/workflows/issue-630-c1-driver.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    # CPU-only selfhost proof: keep it on GitHub-hosted CPU, not the disabled GPU runner.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "1"
    steps:
      - name: Checkout stacked C1 driver
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Verify stacked SENS whole-artifact pin
        run: |
          test "$(git -C external/sens rev-parse HEAD)" = "69d4bb7f8390e431b479eb17ea68dcefb80d04f9"
          grep -q '(build-source-sha . "69d4bb7f8390e431b479eb17ea68dcefb80d04f9")' upstream-revisions.lisp
          grep -q '(supported-pin-sha . "69d4bb7f8390e431b479eb17ea68dcefb80d04f9")' upstream-revisions.lisp

      - name: Focused formatting
        run: >-
          rustfmt --edition 2024 --check
          src/c1_driver_runtime.rs
          src/c_backend.rs
          src/sens_c1_artifact.rs
          src/sens_current_lowering.rs
          src/sens_rich_bridge.rs

      - name: Compiled C1 exact whole-artifact witness
        env:
          CML_PRODUCER_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          cargo test -j 2 -p cml --lib sens_c1_artifact::tests
          -- --nocapture --test-threads=1

      - name: SW1 runtime transport regression
        run: >-
          cargo test -j 2 -p cml --test c1_domain_transport_runtime_test
          -- --nocapture --test-threads=1
