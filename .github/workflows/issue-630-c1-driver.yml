name: Issue 630 executable C1 driver
# canonical #630 driver gate; prerequisite audits are manual-only.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "external/sens"
      - "upstream-revisions.lisp"
      - "src/c1_driver_runtime.rs"
      - "src/c_backend.rs"
      - "src/sens_c1_artifact.rs"
      - "tests/current_sens_c0_lowering_test.rs"
      - ".github/workflows/issue-630-c1-driver.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, guix]
    timeout-minutes: 30
    steps:
      - name: Require private dependency read token
        env:
          SENS_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
        run: test -n "$SENS_READ_TOKEN"

      - name: Checkout stacked C1 driver
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
          submodules: true

      - name: Verify stacked SENS whole-artifact pin
        run: |
          test "$(git -C external/sens rev-parse HEAD)" = "c66d4743bb70882c75376dbcec27d393e5a9649d"
          grep -q '(build-source-sha . "c66d4743bb70882c75376dbcec27d393e5a9649d")' upstream-revisions.lisp
          grep -q '(supported-pin-sha . "c66d4743bb70882c75376dbcec27d393e5a9649d")' upstream-revisions.lisp

      - name: Focused formatting
        run: >-
          guix shell --pure -m manifest.scm --
          rustfmt --edition 2024 --check
          src/c1_driver_runtime.rs
          src/c_backend.rs
          src/sens_c1_artifact.rs

      - name: Compiled C1 exact whole-artifact witness
        env:
          CML_PRODUCER_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          guix shell --pure -m manifest.scm --
          cargo test -j 1 -p cml --lib sens_c1_artifact::tests -- --nocapture --test-threads=1

      - name: SW1 runtime transport regression
        run: >-
          guix shell --pure -m manifest.scm --
          cargo test -j 1 -p cml --test c1_domain_transport_runtime_test -- --nocapture --test-threads=1
