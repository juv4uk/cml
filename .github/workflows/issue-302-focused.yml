name: Issue 302 focused C backend no-Prim boundary

on:
  pull_request:
    paths:
      - src/c_backend.rs
      - tests/c_backend_test.rs
      - tests/c_backend_conformance_test.rs
      - tests/exhaustive_classification_test.rs
      - tests/ir_classification_matrix_test.rs
      - manifest.scm
      - .github/workflows/issue-302-focused.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: [self-hosted, guix]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Format check
        run: guix shell --pure -m manifest.scm -- cargo fmt -p cml -- --check
      - name: C backend regression
        run: guix shell --pure -m manifest.scm -- cargo test --test c_backend_test -- --nocapture
      - name: C backend conformance
        run: guix shell --pure -m manifest.scm -- cargo test --test c_backend_conformance_test -- --nocapture
      - name: Exhaustive classification
        run: guix shell --pure -m manifest.scm -- cargo test --test exhaustive_classification_test -- --nocapture
      - name: IR classification matrix
        run: guix shell --pure -m manifest.scm -- cargo test --test ir_classification_matrix_test -- --nocapture
      - name: C frontend preserves exact Sid8
        run: guix shell --pure -m manifest.scm -- cargo test --test c_frontend_sid8_identity_test -- --nocapture
      - name: Direct SID8 C dispatch remains exact
        run: guix shell --pure -m manifest.scm -- cargo test --test direct_sid8_c_backend_dispatch_test -- --nocapture
      - name: Current predicate record-domain witness
        run: guix shell --pure -m manifest.scm -- cargo test --test c_backend_test c_backend_current_predicates_return_upstream_record_domains -- --exact --nocapture
