name: Issue 302 focused C backend no-Prim boundary

on:
  pull_request:
    paths:
      - src/c_backend.rs
      - tests/c_backend_test.rs
      - tests/c_backend_conformance_test.rs
      - tests/exhaustive_classification_test.rs
      - tests/ir_classification_matrix_test.rs
      - .github/workflows/issue-302-focused.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: Hydrate private SENS submodule from runner mirror
        shell: bash
        run: |
          set -euo pipefail
          git config submodule.external/sens.url /home/agents/GitHub/sens
          git -c protocol.file.allow=always -c safe.directory='*' submodule update --init external/sens
          git -C external/sens log -1 --format='external/sens %H'
      - uses: dtolnay/rust-toolchain@stable
      - name: Format check
        run: cargo fmt -p cml -- --check
      - name: C backend regression
        run: cargo test --test c_backend_test -- --nocapture
      - name: C backend conformance
        run: cargo test --test c_backend_conformance_test -- --nocapture
      - name: Exhaustive classification
        run: cargo test --test exhaustive_classification_test -- --nocapture
      - name: IR classification matrix
        run: cargo test --test ir_classification_matrix_test -- --nocapture
      - name: C frontend preserves exact Sid8
        run: cargo test --test c_frontend_sid8_identity_test -- --nocapture
      - name: Direct SID8 C dispatch remains exact
        run: cargo test --test direct_sid8_c_backend_dispatch_test -- --nocapture
      - name: Current predicate record-domain witness
        run: cargo test --test c_backend_test c_backend_current_predicates_return_upstream_record_domains -- --exact --nocapture
