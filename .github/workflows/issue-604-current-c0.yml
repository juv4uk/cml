name: Issue 604 current SENS C0 artifact

on:
  pull_request:
    branches: [master]
    paths:
      - "src/sens_c0_artifact.rs"
      - "src/sens_current_lowering.rs"
      - "src/c_backend.rs"
      - "src/ir.rs"
      - "src/lib.rs"
      - "src/sens_compiler_export.rs"
      - "upstream-revisions.lisp"
      - "external/sens"
      - ".github/workflows/issue-604-current-c0.yml"
  push:
    branches: [master]
    paths:
      - "src/sens_c0_artifact.rs"
      - "src/sens_current_lowering.rs"
      - "src/c_backend.rs"
      - "src/ir.rs"
      - "src/lib.rs"
      - "src/sens_compiler_export.rs"
      - "upstream-revisions.lisp"
      - "external/sens"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, guix]
    timeout-minutes: 30
    steps:
      - name: Require private dependency read token
        env:
          SENS_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
        run: test -n "$SENS_READ_TOKEN"

      - name: Checkout CML with pinned SENS
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
          submodules: true

      - name: Verify exact SENS pin
        run: |
          test "$(git -C external/sens rev-parse HEAD)" = "f2e7797283c8dfc2aa67935a02b3735a8290041f"
          grep -q '(build-source-sha . "f2e7797283c8dfc2aa67935a02b3735a8290041f")' upstream-revisions.lisp
          grep -q '(supported-pin-sha . "f2e7797283c8dfc2aa67935a02b3735a8290041f")' upstream-revisions.lisp

      - name: Formatting
        run: >-
          guix shell --pure -m manifest.scm --
          rustfmt --edition 2024 --check src/sens_c0_artifact.rs

      - name: C0 artifact tests
        run: >-
          guix shell --pure -m manifest.scm --
          cargo test -p cml sens_c0_artifact::tests -- --nocapture
