name: Direct SID8 backend dispatch

on:
  pull_request:
    paths:
      - "src/x86_freestanding.rs"
      - "src/c_backend.rs"
      - "tests/direct_sid8_x86_dispatch_test.rs"
      - "tests/direct_sid8_c_backend_dispatch_test.rs"
      - ".github/workflows/direct-sid8-x86-dispatch.yml"
  workflow_dispatch:

jobs:
  direct-sid8-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Exact direct SID8 x86 dispatch witness
        run: cargo test --test direct_sid8_x86_dispatch_test -- --nocapture

  direct-sid8-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Rustfmt changed SID8 files
        run: rustfmt --edition 2024 --check src/c_backend.rs tests/direct_sid8_c_backend_dispatch_test.rs
      - name: Exact direct SID8 C-backend dispatch witness
        run: cargo test --test direct_sid8_c_backend_dispatch_test -- --nocapture
      - name: Existing C backend regression suite
        run: cargo test --test c_backend_test -- --nocapture
      - name: Existing explicit COND C backend suite
        run: cargo test --test explicit_cond_backend_test -- --nocapture
      - name: Existing typed buffer C backend suite
        run: cargo test --test typed_buffer_ir_test -- --nocapture
