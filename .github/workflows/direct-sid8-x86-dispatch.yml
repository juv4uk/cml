name: Direct SID8 backend dispatch

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    paths:
      - "src/x86_freestanding.rs"
      - "src/c_backend.rs"
      - "tests/direct_sid8_x86_dispatch_test.rs"
      - "tests/direct_sid8_c_backend_dispatch_test.rs"
      - ".github/workflows/direct-sid8-x86-dispatch.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  direct-sid8-x86:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: Hydrate private SENS submodule from runner mirror
        shell: bash
        run: |
          set -euo pipefail
          git config submodule.external/sens.url /home/agents/GitHub/sens
          git -c protocol.file.allow=always -c safe.directory='*' submodule update --init external/sens
          git -C external/sens log -1 --format='external/sens %H'
      - uses: dtolnay/rust-toolchain@stable
      - name: Exact direct SID8 x86 dispatch witness
        run: cargo test --test direct_sid8_x86_dispatch_test -- --nocapture

  direct-sid8-c:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      - name: Hydrate private SENS submodule from runner mirror
        shell: bash
        run: |
          set -euo pipefail
          git config submodule.external/sens.url /home/agents/GitHub/sens
          git -c protocol.file.allow=always -c safe.directory='*' submodule update --init external/sens
          git -C external/sens log -1 --format='external/sens %H'
      - uses: dtolnay/rust-toolchain@stable
      - name: Rustfmt changed SID8 files
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          rustfmt --edition 2024 src/c_backend.rs tests/direct_sid8_c_backend_dispatch_test.rs
          if ! git diff --quiet -- src/c_backend.rs tests/direct_sid8_c_backend_dispatch_test.rs; then
            {
              printf '%s\n' 'Exact rustfmt diff for #238 SID8 slice:'
              printf '%s\n' '\`\`\`diff'
              git diff -- src/c_backend.rs tests/direct_sid8_c_backend_dispatch_test.rs
              printf '%s\n' '\`\`\`'
            } > /tmp/rustfmt-comment.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/rustfmt-comment.md
            exit 1
          fi
      - name: Exact direct SID8 C-backend dispatch witness
        run: cargo test --test direct_sid8_c_backend_dispatch_test -- --nocapture
      - name: Existing C backend regression suite
        run: cargo test --test c_backend_test -- --nocapture
      - name: Existing explicit COND C backend suite
        run: cargo test --test explicit_cond_backend_test -- --nocapture
      - name: Existing typed buffer C backend suite
        run: cargo test --test typed_buffer_ir_test -- --nocapture
