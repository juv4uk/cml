name: c-backend closure multiplication diagnostic

on:
  pull_request:
    paths:
      - "tests/c_backend_test.rs"
      - ".github/workflows/closure-mul-diagnostic.yml"

jobs:
  closure-mul:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Prove current EQ result domain
        run: cargo test --test c_backend_test c_backend_eq_returns_identity_relation_records -- --nocapture
      - name: Prove quotient consumes current EQ domain
        run: cargo test --test c_backend_test c_backend_current_eq_domain_drives_canonical_cond_in_quotient_slice -- --nocapture
