name: GPU compiler verified rich admission

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Hosted native Rust semantics; Guix-pure reproducibility remains UNVERIFIED.
      - uses: dtolnay/rust-toolchain@stable
      - name: Require private dependency read token
        env:
          SENS_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
        run: test -n "$SENS_READ_TOKEN"

      - name: Checkout CML with pinned SENS
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
          submodules: true

      - name: Focused formatting
        run: >-
          
          rustfmt --edition 2024 --check
          src/sens_domain_bridge.rs
          src/sens_rich_bridge.rs

      - name: Existing exact-domain authority bridge
        run: >-
          
          cargo test -j 1 -p cml sens_domain_bridge::tests -- --nocapture --test-threads=1

      - name: Verified rich-role admission
        run: >-
          
          cargo test -j 1 -p cml sens_rich_bridge::tests -- --nocapture --test-threads=1

      - name: Rich mechanism binding regression
        run: >-
          
          cargo test -j 1 -p cml compiler_mechanism::tests -- --nocapture --test-threads=1
