name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cml
        uses: actions/checkout@v4
        with:
          path: cml
          # external/my-lisp is a real submodule now (SUBMODULE-DEPENDENCY-
          # MODEL-2026-09-16): my-lisp is a contract dependency (cml reads
          # its .lisp source tree directly for the encoder bridge, CPU
          # profile, and conformance corpus), so it travels with cml's own
          # checkout instead of a separately pinned sibling checkout.
          submodules: true

      - name: Resolve my-lisp revision channels
        id: upstream_revisions
        working-directory: cml
        shell: bash
        run: |
          set -euo pipefail
          manifest="upstream-revisions.lisp"
          field() {
            local name="$1"
            grep -F "(${name} . \"" "$manifest" | head -n 1 | cut -d'"' -f2
          }
          build_source_sha="$(field build-source-sha)"
          supported_pin_sha="$(field supported-pin-sha)"
          observed_current_sha="$(field observed-current-sha)"
          bootstrap_core1_sha="$(field bootstrap-core1-source-sha)"
          test "${#build_source_sha}" -eq 40
          test "${#supported_pin_sha}" -eq 40
          test "${#observed_current_sha}" -eq 40
          test "${#bootstrap_core1_sha}" -eq 40
          actual_build_sha="$(git -C external/my-lisp rev-parse HEAD)"
          if [[ "$build_source_sha" != "$actual_build_sha" ]]; then
            echo "build-source mismatch: manifest=$build_source_sha gitlink=$actual_build_sha" >&2
            exit 1
          fi
          echo "build_source_sha=$build_source_sha" >> "$GITHUB_OUTPUT"
          echo "supported_pin_sha=$supported_pin_sha" >> "$GITHUB_OUTPUT"
          echo "observed_current_sha=$observed_current_sha" >> "$GITHUB_OUTPUT"
          echo "bootstrap_core1_sha=$bootstrap_core1_sha" >> "$GITHUB_OUTPUT"
          echo "upstream-channel build-source sha=$build_source_sha"
          echo "upstream-channel supported-pin sha=$supported_pin_sha"
          echo "upstream-channel observed-current sha=$observed_current_sha"
          echo "upstream-channel bootstrap-core1-source sha=$bootstrap_core1_sha"

      - name: Checkout my-lisp (supported compatibility evidence)
        uses: actions/checkout@v4
        with:
          repository: juv4uk/my-lisp
          ref: ${{ steps.upstream_revisions.outputs.supported_pin_sha }}
          path: my-lisp-supported

      - name: Checkout my-lisp (observed-current)
        uses: actions/checkout@v4
        with:
          repository: juv4uk/my-lisp
          ref: ${{ steps.upstream_revisions.outputs.observed_current_sha }}
          path: my-lisp

      - name: Checkout my-lisp (Core1 bootstrap source)
        uses: actions/checkout@v4
        with:
          repository: juv4uk/my-lisp
          ref: ${{ steps.upstream_revisions.outputs.bootstrap_core1_sha }}
          path: my-lisp-bootstrap

      - name: Validate Core1 bootstrap source
        working-directory: cml
        shell: bash
        run: |
          set -euo pipefail
          test -f ../my-lisp-bootstrap/lib/core1-compiler-prelude.lisp
          test -f ../my-lisp-bootstrap/contracts/core1-historical-sid-map.lisp

      - name: Report my-lisp revision drift
        working-directory: cml
        shell: bash
        run: |
          set -euo pipefail
          supported_math=absent
          observed_math=absent
          bootstrap_prelude=absent
          [[ -f ../my-lisp-supported/tests/fixtures/mathematical-result-v1.lisp ]] && supported_math=present
          [[ -f ../my-lisp/tests/fixtures/mathematical-result-v1.lisp ]] && observed_math=present
          [[ -f ../my-lisp-bootstrap/lib/core1-compiler-prelude.lisp ]] && bootstrap_prelude=present
          echo "((kind . cml-upstream-revision-drift) (build-source-sha . \"${{ steps.upstream_revisions.outputs.build_source_sha }}\") (supported-pin-sha . \"${{ steps.upstream_revisions.outputs.supported_pin_sha }}\") (observed-current-sha . \"${{ steps.upstream_revisions.outputs.observed_current_sha }}\") (bootstrap-core1-source-sha . \"${{ steps.upstream_revisions.outputs.bootstrap_core1_sha }}\") (bootstrap-core1-prelude . ${bootstrap_prelude}) (mathematical-result-v1 . ((supported-pin . ${supported_math}) (observed-current . ${observed_math})))))"

      - name: Checkout fpga-lisp (sibling, provides RTL + simulator testbench)
        uses: actions/checkout@v4
        with:
          repository: juv4uk/fpga-lisp
          ref: b5d68bba109b972122f92fa10d237f81ce90aa87
          path: fpga-lisp

      - name: Checkout wsm-my-lisp (provides x86 asm nucleus witness)
        uses: actions/checkout@v4
        with:
          repository: juv4uk/wsm-my-lisp
          ref: 1fe661664479c92da1968d60914b512320678ac2
          path: wsm-my-lisp

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: cargo fmt
        working-directory: cml
        run: cargo fmt -p cml -- --check

      - name: cargo test
        working-directory: cml
        env:
          CML_SUPPORTED_MY_LISP_ROOT: ${{ github.workspace }}/my-lisp-supported
        run: cargo test --verbose
