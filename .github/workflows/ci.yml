name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cml
        uses: actions/checkout@v4
        with:
          path: cml

      - name: Checkout my-lisp (sibling, provides conformance fixtures)
        uses: actions/checkout@v4
        with:
          repository: juv4uk/my-lisp
          ref: d4ad7e7c7717a610599875ffb90123b713ac05c7
          path: my-lisp

      - name: Checkout fpga-lisp (sibling, provides RTL + simulator testbench)
        uses: actions/checkout@v4
        with:
          repository: juv4uk/fpga-lisp
          ref: b5d68bba109b972122f92fa10d237f81ce90aa87
          path: fpga-lisp

      - name: Checkout wsm-my-lisp (provides x86 asm nucleus witness)
        uses: actions/checkout@v4
        with:
          repository: juv4uk/wsm-my-lisp
          ref: 1fe661664479c92da1968d60914b512320678ac2
          path: wsm-my-lisp

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: cargo fmt
        working-directory: cml
        run: cargo fmt -p cml -- --check

      - name: cargo test
        working-directory: cml
        run: cargo test --verbose
