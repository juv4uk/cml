name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cml
        uses: actions/checkout@v4
        with:
          path: cml

      - name: Checkout my-lisp (sibling, provides conformance fixtures)
        uses: actions/checkout@v4
        with:
          repository: juv4uk/my-lisp
          ref: ccacc68ef6729a0973bdd1fc41906fc160127f89
          path: my-lisp

      - name: Checkout fpga-lisp (sibling, provides RTL + simulator testbench)
        uses: actions/checkout@v4
        with:
          repository: juv4uk/fpga-lisp
          ref: 80e2fc170650b391f128353985445291da493957
          path: fpga-lisp

      - name: Checkout wsm-my-lisp (provides x86 asm nucleus witness)
        uses: actions/checkout@v4
        with:
          repository: juv4uk/wsm-my-lisp
          ref: ed7f43fa42c58f4cb3131379694e2842775d2bf5
          path: wsm-my-lisp
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: cargo fmt
        working-directory: cml
        run: cargo fmt -p cml -- --check

      - name: cargo test
        working-directory: cml
        run: cargo test --verbose
