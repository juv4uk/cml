name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cml
        uses: actions/checkout@v4
        with:
          path: cml
          # external/my-lisp is a real submodule now (SUBMODULE-DEPENDENCY-
          # MODEL-2026-09-16): my-lisp is a contract dependency (cml reads
          # its .lisp source tree directly for the encoder bridge, CPU
          # profile, and conformance corpus), so it travels with cml's own
          # checkout instead of a separately pinned sibling checkout.
          submodules: true

      # revision_contract_test.rs deliberately checks against a frozen,
      # independently-pinned historical my-lisp snapshot (MY_LISP_SHA) for
      # the Reader Contract 4 compatibility record — a different, intentionally
      # versioned concern from the external/my-lisp submodule above (which
      # always tracks cml's own current contract dependency). Both my-lisp
      # checkouts coexisting here is correct, not duplication.
      - name: Checkout my-lisp (sibling, frozen snapshot for revision_contract_test)
        uses: actions/checkout@v4
        with:
          repository: juv4uk/my-lisp
          ref: d4ad7e7c7717a610599875ffb90123b713ac05c7
          path: my-lisp

      - name: Checkout fpga-lisp (sibling, provides RTL + simulator testbench)
        uses: actions/checkout@v4
        with:
          repository: juv4uk/fpga-lisp
          ref: b5d68bba109b972122f92fa10d237f81ce90aa87
          path: fpga-lisp

      - name: Checkout wsm-my-lisp (provides x86 asm nucleus witness)
        uses: actions/checkout@v4
        with:
          repository: juv4uk/wsm-my-lisp
          ref: 1fe661664479c92da1968d60914b512320678ac2
          path: wsm-my-lisp

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: cargo fmt
        working-directory: cml
        run: cargo fmt -p cml -- --check

      - name: cargo test
        working-directory: cml
        run: cargo test --verbose
