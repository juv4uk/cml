name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: self-hosted
    steps:
      - name: Checkout cml
        uses: actions/checkout@v4
        with:
          path: cml
          # external/sens is a real submodule now: sens is the contract dependency
          # (cml reads its .lisp source tree directly for the encoder bridge, CPU
          # profile, and conformance corpus), so it travels with cml's own
          # checkout instead of a separately pinned sibling checkout.
          submodules: false

      - name: Hydrate private SENS submodule from runner mirror
        working-directory: cml
        shell: bash
        run: |
          set -euo pipefail
          git config submodule.external/sens.url /home/agents/GitHub/sens
          git -c protocol.file.allow=always -c safe.directory='*' submodule update --init external/sens
          git -C external/sens log -1 --format='external/sens %H'

      - name: SENS conformance adapter self-test
        working-directory: cml
        run: python3 scripts/test-sens-execution-conformance-adapter.py

      - name: Resolve sens revision channels
        id: upstream_revisions
        working-directory: cml
        shell: bash
        run: |
          set -euo pipefail
          manifest="upstream-revisions.lisp"
          field() {
            local name="$1"
            grep -F "(${name} . \"" "$manifest" | head -n 1 | cut -d'"' -f2
          }
          build_source_sha="$(field build-source-sha)"
          supported_pin_sha="$(field supported-pin-sha)"
          observed_current_sha="$(field observed-current-sha)"
          bootstrap_core1_sha="$(field bootstrap-core1-source-sha)"
          test "${#build_source_sha}" -eq 40
          test "${#supported_pin_sha}" -eq 40
          test "${#observed_current_sha}" -eq 40
          test "${#bootstrap_core1_sha}" -eq 40
          actual_build_source_sha="$(git -C external/sens rev-parse HEAD)"
          if [[ "$build_source_sha" != "$actual_build_source_sha" ]]; then
            echo "build-source mismatch: manifest=$build_source_sha gitlink=$actual_build_source_sha" >&2
            exit 1
          fi
          echo "build_source_sha=$build_source_sha" >> "$GITHUB_OUTPUT"
          echo "supported_pin_sha=$supported_pin_sha" >> "$GITHUB_OUTPUT"
          echo "observed_current_sha=$observed_current_sha" >> "$GITHUB_OUTPUT"
          echo "bootstrap_core1_sha=$bootstrap_core1_sha" >> "$GITHUB_OUTPUT"
          echo "upstream-channel build-source sha=$build_source_sha"
          echo "upstream-channel supported-pin sha=$supported_pin_sha"
          echo "upstream-channel observed-current sha=$observed_current_sha"
          echo "upstream-channel bootstrap-core1-source sha=$bootstrap_core1_sha"

      - name: Checkout sens (supported evidence) from runner mirror
        shell: bash
        env:
          REVISION: ${{ steps.upstream_revisions.outputs.supported_pin_sha }}
        run: |
          set -euo pipefail
          rm -rf sens-supported
          git -c protocol.file.allow=always clone --no-checkout /home/agents/GitHub/sens sens-supported
          git -C sens-supported checkout --detach "$REVISION"

      - name: Checkout sens (observed-current) from runner mirror
        shell: bash
        env:
          REVISION: ${{ steps.upstream_revisions.outputs.observed_current_sha }}
        run: |
          set -euo pipefail
          rm -rf sens
          git -c protocol.file.allow=always clone --no-checkout /home/agents/GitHub/sens sens
          git -C sens checkout --detach "$REVISION"

      - name: Checkout sens (Core1 bootstrap source) from runner mirror
        shell: bash
        env:
          REVISION: ${{ steps.upstream_revisions.outputs.bootstrap_core1_sha }}
        run: |
          set -euo pipefail
          rm -rf sens-bootstrap
          git -c protocol.file.allow=always clone --no-checkout /home/agents/GitHub/sens sens-bootstrap
          git -C sens-bootstrap checkout --detach "$REVISION"

      - name: Validate Core1 bootstrap source
        working-directory: cml
        shell: bash
        run: |
          set -euo pipefail
          test -f ../sens-bootstrap/lib/core1-compiler-prelude.lisp
          test -f ../sens-bootstrap/contracts/core1-historical-sid-map.lisp
          echo "bootstrap-core1-source sha=${{ steps.upstream_revisions.outputs.bootstrap_core1_sha }}"
          echo "bootstrap-core1-prelude blob=$(git -C ../sens-bootstrap hash-object lib/core1-compiler-prelude.lisp)"

      - name: Report sens revision drift
        working-directory: cml
        shell: bash
        run: |
          set -euo pipefail
          build_math=absent
          supported_math=absent
          observed_math=absent
          bootstrap_prelude=absent
          [[ -f external/sens/tests/fixtures/mathematical-result-v1.lisp ]] && build_math=present
          [[ -f ../sens-supported/tests/fixtures/mathematical-result-v1.lisp ]] && supported_math=present
          [[ -f ../sens/tests/fixtures/mathematical-result-v1.lisp ]] && observed_math=present
          [[ -f ../sens-bootstrap/lib/core1-compiler-prelude.lisp ]] && bootstrap_prelude=present
          echo "((kind . cml-upstream-revision-drift) (build-source-sha . \"${{ steps.upstream_revisions.outputs.build_source_sha }}\") (supported-pin-sha . \"${{ steps.upstream_revisions.outputs.supported_pin_sha }}\") (observed-current-sha . \"${{ steps.upstream_revisions.outputs.observed_current_sha }}\") (bootstrap-core1-source-sha . \"${{ steps.upstream_revisions.outputs.bootstrap_core1_sha }}\") (bootstrap-core1-prelude . ${bootstrap_prelude}) (mathematical-result-v1 . ((build-source . ${build_math}) (supported-pin . ${supported_math}) (observed-current . ${observed_math}))))"

      - name: Checkout fpga-lisp from runner mirror
        shell: bash
        run: |
          set -euo pipefail
          rm -rf fpga-lisp
          git -c protocol.file.allow=always clone --no-checkout /home/agents/GitHub/fpga-lisp fpga-lisp
          git -C fpga-lisp checkout --detach d1cb7eb79f675e8f2cc128c3b12918d6b08b9413

      - name: Checkout wsm-my-lisp from runner mirror
        shell: bash
        run: |
          set -euo pipefail
          rm -rf wsm-my-lisp
          git -c protocol.file.allow=always clone --no-checkout /home/agents/GitHub/wsm-my-lisp wsm-my-lisp
          git -C wsm-my-lisp checkout --detach 1fe661664479c92da1968d60914b512320678ac2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Import real SENS Contract 11.6 oracle rows
        working-directory: cml
        shell: bash
        run: |
          set -euo pipefail
          (
            cd ../sens
            cargo build --release -p sens --example current_en_vs_d1d8_cpu
            python3 benchmarks/execution-ladder-conformance/emit_oracle.py \
              --manifest benchmarks/current-en-vs-d1d8/fixtures/d3-smoke.json \
              --helper target/release/examples/current_en_vs_d1d8_cpu \
              --out /tmp/sens-d3-oracle.jsonl
          )
          python3 scripts/check-sens-execution-conformance.py \
            /tmp/sens-d3-oracle.jsonl \
            --sens-dir ../sens \
            | tee /tmp/cml-sens-oracle-import.txt
          test "$(grep -c '^CML-CONFORMANCE-CASE ' /tmp/cml-sens-oracle-import.txt)" -eq 2
          grep -F "CML-CONFORMANCE-IMPORT-GREEN cases=2" /tmp/cml-sens-oracle-import.txt

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: cargo fmt
        working-directory: cml
        run: cargo fmt -p cml -- --check

      - name: cargo test
        working-directory: cml
        run: cargo test --verbose --no-fail-fast