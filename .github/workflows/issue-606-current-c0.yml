name: Issue 606 verified current C0 lowering

on:
  pull_request:
    branches: [master]
    paths:
      - "src/ir.rs"
      - "src/c_backend.rs"
      - "src/lib.rs"
      - "src/sens_compiler_export.rs"
      - "src/sens_current_lowering.rs"
      - "tests/current_sens_c0_lowering_test.rs"
      - ".github/workflows/issue-606-current-c0.yml"
  push:
    branches: [master]
    paths:
      - "src/ir.rs"
      - "src/c_backend.rs"
      - "src/lib.rs"
      - "src/sens_current_lowering.rs"
      - "tests/current_sens_c0_lowering_test.rs"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, gpu, gtx-1050-ti, cuda-12.6]
    timeout-minutes: 30
    steps:
      - name: Require private dependency read token
        env:
          SENS_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
        run: test -n "$SENS_READ_TOKEN"

      - name: Checkout CML with pinned SENS
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
          submodules: true

      - name: Verify canonical producer-owned SENS pin
        run: |
          test "$(git -C external/sens rev-parse HEAD)" = "1869fd5e51f38565ca968abceaa4bc933ae7a114"
          grep -q '(build-source-sha . "1869fd5e51f38565ca968abceaa4bc933ae7a114")' upstream-revisions.lisp
          grep -q '(supported-pin-sha . "1869fd5e51f38565ca968abceaa4bc933ae7a114")' upstream-revisions.lisp

      - name: Focused formatting
        run: >-
          guix shell --pure -m manifest.scm --
          rustfmt --edition 2024 --check
          src/ir.rs
          src/c_backend.rs
          src/sens_current_lowering.rs
          tests/current_sens_c0_lowering_test.rs

      - name: Canonical export consumer regression
        run: >-
          guix shell --pure -m manifest.scm --
          cargo test -p cml --lib sens_compiler_export::tests -- --nocapture

      - name: Verified current lowering unit tests
        run: >-
          guix shell --pure -m manifest.scm --
          cargo test -p cml --lib sens_current_lowering::tests -- --nocapture

      - name: Real-export current C0 executable lowering witness
        run: >-
          guix shell --pure -m manifest.scm --
          cargo test -p cml --test current_sens_c0_lowering_test -- --nocapture

      - name: Current exact D1 carrier regression
        run: >-
          guix shell --pure -m manifest.scm --
          cargo test -p cml --test current_d1_c_backend_test -- --nocapture

      - name: Current exact D1 COND codegen regression
        run: >-
          guix shell --pure -m manifest.scm --
          cargo test -p cml --test current_d1_cond_codegen_test -- --nocapture

      - name: Current exact D1 COND executable regression
        run: >-
          guix shell --pure -m manifest.scm --
          cargo test -p cml --test current_d1_cond_backend_test -- --nocapture

      - name: Existing C backend regression
        run: >-
          guix shell --pure -m manifest.scm --
          cargo test -p cml --test c_backend_test -- --nocapture
