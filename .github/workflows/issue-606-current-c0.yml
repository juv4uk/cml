name: Issue 606 current SENS C0 lowering

on:
  pull_request:
    branches: [master]
    paths:
      - "src/ir.rs"
      - "src/c_backend.rs"
      - "src/lib.rs"
      - "src/sens_current_lowering.rs"
      - "tests/current_sens_c0_lowering_test.rs"
      - ".github/workflows/issue-606-current-c0.yml"
  push:
    branches: [master]
    paths:
      - "src/ir.rs"
      - "src/c_backend.rs"
      - "src/lib.rs"
      - "src/sens_current_lowering.rs"
      - "tests/current_sens_c0_lowering_test.rs"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, guix]
    timeout-minutes: 30
    steps:
      - name: Require private dependency read token
        env:
          SENS_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
        run: test -n "$SENS_READ_TOKEN"

      - name: Checkout CML with pinned SENS
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
          submodules: true

      - name: Verify exact SENS pin
        run: |
          test "$(git -C external/sens rev-parse HEAD)" = "08db33ced8643aedaa7de35cb61407900c0b0c05"
          grep -q '(build-source-sha . "08db33ced8643aedaa7de35cb61407900c0b0c05")' upstream-revisions.lisp

      - name: Formatting
        run: >-
          guix shell --pure -m manifest.scm --
          rustfmt --edition 2024 --check
          src/ir.rs
          src/c_backend.rs
          src/sens_current_lowering.rs
          tests/current_sens_c0_lowering_test.rs

      - name: Current SENS lowering unit tests
        run: >-
          guix shell --pure -m manifest.scm --
          cargo test -p cml sens_current_lowering::tests -- --nocapture

      - name: Current SENS C0 executable lowering witness
        run: >-
          guix shell --pure -m manifest.scm --
          cargo test -p cml --test current_sens_c0_lowering_test -- --nocapture

      - name: Existing C backend regression
        run: >-
          guix shell --pure -m manifest.scm --
          cargo test -p cml --test c_backend_test -- --nocapture
