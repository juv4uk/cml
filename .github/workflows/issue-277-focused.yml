name: Issue 277 focused FPGA no-Prim boundary

on:
  pull_request:
    paths:
      - src/compiler.rs
      - tests/compiler_test.rs
      - tests/exhaustive_classification_test.rs
      - tests/ir_classification_matrix_test.rs
      - .github/workflows/issue-277-focused.yml

jobs:
  focused:
    runs-on: [self-hosted, guix]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          path: cml
          submodules: recursive
      - uses: actions/checkout@v5
        with:
          repository: juv4uk/fpga-lisp
          ref: b5d68bba109b972122f92fa10d237f81ce90aa87
          path: fpga-lisp
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Icarus Verilog (if absent)
        # На локальному self-hosted runner-і sudo просить пароль, тому
        # безумовний `sudo apt-get` падав би на кожному запуску. iverilog
        # уже встановлено в образі runner-а; встановлюємо лише якщо
        # справді немає, і тоді з явним діагностичним повідомленням.
        run: |
          if command -v iverilog >/dev/null 2>&1; then
            echo "iverilog present: $(iverilog -V 2>&1 | head -1)"
          else
            echo "::error::iverilog is absent and this runner has no passwordless sudo."
            echo "Install it on the runner image, or grant passwordless sudo for apt."
            exit 1
          fi
      - name: Format check
        working-directory: cml
        run: cargo fmt -p cml -- --check
      - name: FPGA compiler regression
        working-directory: cml
        run: cargo test --test compiler_test -- --nocapture
      - name: Exhaustive IR classification
        working-directory: cml
        run: cargo test --test exhaustive_classification_test -- --nocapture
      - name: IR classification matrix
        working-directory: cml
        run: cargo test --test ir_classification_matrix_test -- --nocapture
