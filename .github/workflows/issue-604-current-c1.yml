name: Issue 604 current SENS C1 artifact

on:
  pull_request:
    branches: [master]
    paths:
      - "external/sens"
      - "upstream-revisions.lisp"
      - "src/lib.rs"
      - "src/sens_c1_artifact.rs"
      - "src/sens_compiler_export.rs"
      - "src/sens_current_lowering.rs"
      - "src/c_backend.rs"
      - ".github/workflows/issue-604-current-c1.yml"
  push:
    branches: [master]
    paths:
      - "external/sens"
      - "upstream-revisions.lisp"
      - "src/sens_c1_artifact.rs"
      - "src/sens_compiler_export.rs"
      - "src/sens_current_lowering.rs"
      - "src/c_backend.rs"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, gpu, gtx-1050-ti, cuda-12.6]
    timeout-minutes: 30
    steps:
      - name: Require private dependency read token
        env:
          SENS_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
        run: test -n "$SENS_READ_TOKEN"

      - name: Checkout CML with pinned SENS
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
          submodules: true

      - name: Verify canonical SENS pin
        run: |
          test "$(git -C external/sens rev-parse HEAD)" = "ce33bd30ca48e297a3e4666ed6dd6e33e8725f6f"
          grep -q '(build-source-sha . "ce33bd30ca48e297a3e4666ed6dd6e33e8725f6f")' upstream-revisions.lisp
          grep -q '(supported-pin-sha . "ce33bd30ca48e297a3e4666ed6dd6e33e8725f6f")' upstream-revisions.lisp

      - name: Focused formatting
        run: >-
          guix shell --pure -m manifest.scm --
          rustfmt --edition 2024 --check
          src/sens_c1_artifact.rs

      - name: Canonical verified lowering regression
        run: >-
          guix shell --pure -m manifest.scm --
          cargo test -p cml --lib sens_current_lowering::tests -- --nocapture

      - name: C1 artifact proof and executable witness
        env:
          CML_PRODUCER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          guix shell --pure -m manifest.scm --
          cargo test -p cml --lib sens_c1_artifact::tests -- --nocapture

      - name: Existing real-export C0 lowering regression
        run: >-
          guix shell --pure -m manifest.scm --
          cargo test -p cml --test current_sens_c0_lowering_test -- --nocapture
