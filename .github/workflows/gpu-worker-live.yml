name: GPU runner worker live

on:
  # One controlled CML GPU runner was restored by owner direction 2026-10-05.
  # Keep physical-GPU execution manual-only while the lane is being requalified.
  workflow_dispatch:

concurrency:
  group: gpu-gtx-1050-ti
  cancel-in-progress: false

jobs:
  worker-live:
    runs-on: [self-hosted, gpu, gtx-1050-ti]
    timeout-minutes: 20
    env:
      LD_LIBRARY_PATH: /usr/lib/wsl/lib:/usr/local/cuda-12.6/targets/x86_64-linux/lib:/usr/local/lib/wsm-gcc-runtime
      CUDA_PATH: /usr/local/cuda-12.6
      CUDA_HOME: /usr/local/cuda-12.6
      RUSTC_WRAPPER: /usr/bin/sccache
      SCCACHE_DIR: /home/agents/.cache/sccache
      SCCACHE_CACHE_SIZE: 30G
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - name: Isolate Cargo target by rustc build
        run: |
          rustc_key="$(rustc -vV | sha256sum | cut -c1-16)"
          echo "CARGO_TARGET_DIR=/home/agents/.cache/cargo-target/cml/rustc-$rustc_key" >> "$GITHUB_ENV"

      - name: external/sens from the local clone
        run: |
          git config submodule.external/sens.url /home/agents/GitHub/sens
          git -c protocol.file.allow=always -c safe.directory='*' submodule update --init external/sens

      - name: Build exact-head persistent worker
        run: cargo build --release --features gpu-cuda --bin cml-gpu-worker

      - name: Install exact-head worker and prove runner -> persistent worker -> CUDA
        shell: bash
        run: |
          set -Eeuo pipefail

          worker="$HOME/.local/bin/cml-gpu-worker"
          backup="$HOME/.local/bin/cml-gpu-worker.pre-ci"
          runtime_dir="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          socket="$runtime_dir/cml-gpu-worker.sock"
          export CML_GPU_WORKER_SOCKET="$socket"

          mkdir -p "$HOME/.local/bin"
          rm -f "$backup"
          if [[ -x "$worker" ]]; then
            cp -a "$worker" "$backup"
          fi

          rollback() {
            rc=$?
            if (( rc != 0 )); then
              echo "GPU worker witness failed; restoring previous persistent worker" >&2
              systemctl --user stop cml-gpu-worker.service || true
              if [[ -f "$backup" ]]; then
                mv -f "$backup" "$worker"
                systemctl --user start cml-gpu-worker.service || true
              fi
            fi
            exit "$rc"
          }
          trap rollback EXIT

          systemctl --user stop cml-gpu-worker.service
          install -m 0755 "$CARGO_TARGET_DIR/release/cml-gpu-worker" "$worker.new"
          mv -f "$worker.new" "$worker"
          systemctl --user start cml-gpu-worker.service

          for _ in $(seq 1 80); do
            [[ -S "$socket" ]] && "$worker" ping >/dev/null 2>&1 && break
            sleep 0.1
          done
          [[ -S "$socket" ]]
          test "$("$worker" ping)" = "pong"
          "$worker" probe

          echo "runner=$RUNNER_NAME os=$RUNNER_OS arch=$RUNNER_ARCH"
          echo "worker_sha256=$(sha256sum "$worker" | awk '{print $1}')"
          /usr/lib/wsl/lib/nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv,noheader

          result="$("$worker" add-i32 7 1 2 3 4)"
          test "$result" = "8 9 10 11"
          echo "GPU worker round trip: $result"

          # File-backed workload: 32 MiB / 8,388,608 i32 values and 64
          # admitted map steps. Only paths + offsets cross the socket; the
          # systemd worker keeps the CUDA session and compiled kernel cache alive.
          dd if=/dev/zero of=worker-input.i32 bs=1M count=32 status=none
          offsets=()
          for _ in $(seq 1 64); do offsets+=(1); done

          for iteration in 1 2 3; do
            evidence="$("$worker" chain-file-i32 worker-input.i32 worker-output.i32 "${offsets[@]}")"
            echo "heavy iteration $iteration: $evidence"
          done

          test "$(stat -c %s worker-output.i32)" = "33554432"
          python3 - <<'PY'
          import struct
          with open("worker-output.i32", "rb") as f:
              first = struct.unpack("<i", f.read(4))[0]
              f.seek(-4, 2)
              last = struct.unpack("<i", f.read(4))[0]
          assert first == 64 and last == 64, (first, last)
          print(f"file-backed CUDA witness: first={first} last={last}")
          PY

          systemctl --user is-active --quiet cml-gpu-worker.service
          journalctl --user -u cml-gpu-worker.service -n 30 --no-pager

          rm -f "$backup"
          trap - EXIT
