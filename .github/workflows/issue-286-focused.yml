name: Issue 286 C frontend exact Sid8 boundary

on:
  pull_request:
    paths:
      - src/lower.rs
      - tests/c_frontend_sid8_identity_test.rs
      - src/c_backend.rs
      - .github/workflows/issue-286-focused.yml

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Format check
        run: cargo fmt -p cml -- --check
      - name: Exact C frontend SID8 identity
        run: cargo test --test c_frontend_sid8_identity_test -- --nocapture

  backend-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Direct SID8 C backend witness
        run: cargo test --test direct_sid8_c_backend_dispatch_test -- --nocapture
      - name: C backend regression
        run: cargo test --test c_backend_test -- --nocapture
