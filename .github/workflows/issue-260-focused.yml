name: Issue 260 focused C predicate record domains

on:
  pull_request:
    paths:
      - src/c_backend.rs
      - tests/c_backend_test.rs
      - tests/c_backend_conformance_test.rs
      - .github/workflows/issue-260-focused.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: [self-hosted, guix]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Current predicate record-domain witness
        run: cargo test --test c_backend_test c_backend_current_predicates_return_upstream_record_domains -- --exact --nocapture
      - name: Constitutive C conformance
        run: cargo test --test c_backend_conformance_test -- --nocapture
      - name: Direct SID8 C dispatch remains exact
        run: cargo test --test direct_sid8_c_backend_dispatch_test -- --nocapture
