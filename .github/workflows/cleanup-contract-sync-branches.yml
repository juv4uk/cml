name: Cleanup contract sync branches

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/cleanup-contract-sync-branches.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete stale contract-sync branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in bot/sync-my-lisp-contract feat/auto-language-contract-sync; do
            git push origin --delete "$branch" || true
          done
      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-contract-sync-branches.yml
          git commit -m "chore: remove one-shot contract cleanup workflow"
          git push origin "HEAD:${GITHUB_REF_NAME}"
