name: Issue 265 focused native baseline Sid8 fixtures

on:
  pull_request:
    paths:
      - src/native_baseline.rs
      - .github/workflows/issue-265-focused.yml

jobs:
  focused:
    runs-on: [self-hosted, guix]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Native baseline unit witnesses
        run: cargo test --lib native_baseline::tests -- --nocapture
