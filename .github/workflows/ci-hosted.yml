name: Hosted CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: hosted-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: portable CML gates
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CML_PRODUCER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout CML with pinned SENS build-source
        uses: actions/checkout@v5
        with:
          path: cml
          submodules: recursive
          fetch-depth: 0

      - name: Resolve SENS revision channels
        id: revisions
        working-directory: cml
        shell: bash
        run: |
          set -euo pipefail
          field() {
            grep -F "($1 . \"" upstream-revisions.lisp | head -n 1 | cut -d'"' -f2
          }
          observed_current_sha="$(field observed-current-sha)"
          test "${#observed_current_sha}" -eq 40
          echo "observed_current_sha=$observed_current_sha" >> "$GITHUB_OUTPUT"
          test "$(git -C external/sens rev-parse HEAD)" = "$(field build-source-sha)"

      - name: Checkout observed-current SENS sibling
        uses: actions/checkout@v5
        with:
          repository: juv4uk/sens
          ref: ${{ steps.revisions.outputs.observed_current_sha }}
          path: sens
          fetch-depth: 1

      - name: Checkout reviewed FPGA sibling
        uses: actions/checkout@v5
        with:
          repository: juv4uk/fpga-lisp
          ref: d1cb7eb79f675e8f2cc128c3b12918d6b08b9413
          path: fpga-lisp
          fetch-depth: 1

      - name: Checkout reviewed x86 nucleus sibling
        uses: actions/checkout@v5
        with:
          repository: juv4uk/wsm-my-lisp
          ref: 1fe661664479c92da1968d60914b512320678ac2
          path: wsm-my-lisp
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable

      - name: SENS conformance adapter self-test
        working-directory: cml
        run: python3 scripts/test-sens-execution-conformance-adapter.py

      - name: Import real observed-current Contract 11.8 oracle rows
        shell: bash
        run: |
          set -euo pipefail
          (
            cd sens
            cargo build --release -p sens --example current_en_vs_d1d8_cpu
            python3 benchmarks/execution-ladder-conformance/emit_oracle.py \
              --manifest benchmarks/current-en-vs-d1d8/fixtures/d3-smoke.json \
              --helper target/release/examples/current_en_vs_d1d8_cpu \
              --out /tmp/sens-d3-oracle.jsonl
          )
          (
            cd cml
            python3 scripts/check-sens-execution-conformance.py \
              /tmp/sens-d3-oracle.jsonl \
              --sens-dir ../sens \
              --fpga-handoff-out /tmp/cml-fpga-handoff.lisp \
              | tee /tmp/cml-sens-oracle-import.txt
          )
          test "$(grep -c '^CML-CONFORMANCE-CASE ' /tmp/cml-sens-oracle-import.txt)" -eq 2
          grep -F "CML-CONFORMANCE-IMPORT-GREEN cases=2" /tmp/cml-sens-oracle-import.txt
          grep -F "CML-FPGA-HANDOFF-GREEN cases=2" /tmp/cml-sens-oracle-import.txt
          test "$(grep -c '^(fpga-conformance-handoff/v1 ' /tmp/cml-fpga-handoff.lisp)" -eq 2
          grep -F '(contract . "11.8")' /tmp/cml-fpga-handoff.lisp
          grep -F '(oracle-digest . "' /tmp/cml-fpga-handoff.lisp
          grep -F '(identity-trace-digest . "' /tmp/cml-fpga-handoff.lisp

      - name: SENS CUDA-L3 adapter structural self-test
        working-directory: cml
        run: python3 scripts/test-cml-cuda-l3-conformance.py

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Cargo format
        working-directory: cml
        run: cargo fmt -p cml -- --check

      - name: Cargo tests
        working-directory: cml
        run: cargo test --verbose --no-fail-fast
