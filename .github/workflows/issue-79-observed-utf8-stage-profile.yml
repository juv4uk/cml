name: Issue 79 historical my-lisp UTF-8 stage profile

on:
  pull_request:
    paths:
      - benchmarks/observed-my-lisp-utf8-stage-probe/**
      - .github/workflows/issue-79-observed-utf8-stage-profile.yml

# This exact SHA is an immutable workload measurement snapshot. It must not
# be confused with #84's active observed-current channel.
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MY_LISP_HISTORICAL_WORKLOAD_SHA: ed1ef28928df1db0cc83f17ae993527635b6256d
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: juv4uk/my-lisp
          ref: ${{ env.MY_LISP_HISTORICAL_WORKLOAD_SHA }}
          path: observed-my-lisp
      - uses: dtolnay/rust-toolchain@stable
      - name: Record exact historical upstream experiment revision
        run: |
          echo "upstream_channel=historical-workload-snapshot"
          echo "my_lisp_historical_workload_sha=$MY_LISP_HISTORICAL_WORKLOAD_SHA"
          git -C observed-my-lisp rev-parse HEAD
      - name: Measure release UTF-8 pipeline stages
        run: |
          cargo run --release \
            --manifest-path benchmarks/observed-my-lisp-utf8-stage-probe/Cargo.toml
