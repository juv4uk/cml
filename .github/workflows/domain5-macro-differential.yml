name: D5 macro differential

on:
  pull_request:
    branches: [master]
    paths:
      - "macros.lisp"
      - "tests/domain5_macro_differential_test.rs"
      - "contracts/cml-operations.lisp"
      - "manifest.scm"
      - ".github/workflows/domain5-macro-differential.yml"
  push:
    branches: [master]
    paths:
      - "macros.lisp"
      - "tests/domain5_macro_differential_test.rs"
      - "contracts/cml-operations.lisp"
      - "manifest.scm"
      - ".github/workflows/domain5-macro-differential.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  differential:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Rust MacroExpander vs Lisp reference
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout CML with pinned SENS
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
          submodules: true

      - name: Check focused formatting
        run: guix shell --pure -m manifest.scm -- cargo fmt -p cml -- --check

      - name: Run D5 macro differential
        run: guix shell --pure -m manifest.scm -- cargo test -p cml --test domain5_macro_differential_test -- --nocapture

      - name: Publish D5 summary
        if: always()
        run: |
          {
            echo "## D5 compiler falsifier"
            echo
            echo "- Rust MacroExpander and Lisp-hosted macros.lisp consume one CML-parsed AST corpus."
            echo "- Raw-operand, nested-expansion and definition-order semantics are checked."
            echo "- This gate tests parity only; it does not ratify any D5 code."
          } >> "$GITHUB_STEP_SUMMARY"
