name: Issue 605 SENS role to rich mechanism binding

on:
  pull_request:
    branches: [master]
    paths:
      - "external/sens"
      - "upstream-revisions.lisp"
      - "src/compiler_mechanism.rs"
      - "tests/selfhost_rich_binding_605_test.rs"
      - ".github/workflows/issue-605-focused.yml"
  push:
    branches: [master]
    paths:
      - "external/sens"
      - "upstream-revisions.lisp"
      - "src/compiler_mechanism.rs"
      - "tests/selfhost_rich_binding_605_test.rs"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, guix]
    timeout-minutes: 20
    steps:
      - name: Require private dependency read token
        env:
          SENS_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
        run: test -n "$SENS_READ_TOKEN"

      - name: Checkout CML with pinned SENS
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
          submodules: true

      - name: Focused formatting
        run: >-
          guix shell --pure -m manifest.scm --
          rustfmt --edition 2024 --check
          src/compiler_mechanism.rs tests/selfhost_rich_binding_605_test.rs

      - name: Pure role to mechanism map
        run: >-
          guix shell --pure -m manifest.scm --
          cargo test -p cml --lib compiler_mechanism::tests -- --nocapture

      - name: Real pinned nucleus role closure
        run: >-
          guix shell --pure -m manifest.scm --
          cargo test -p cml --test selfhost_rich_binding_605_test -- --nocapture

      - name: Supported pin equals checked-out SENS
        run: >-
          guix shell --pure -m manifest.scm --
          cargo test -p cml --lib
          sens_domain_bridge::tests::pinned_authority_revision_matches_checked_out_sens_gitlink
          -- --nocapture
