name: Issue 598 compiler artifact provenance

on:
  pull_request:
    branches: [master]
    paths:
      - "src/compiler_artifact.rs"
      - "src/lib.rs"
      - "tests/domain_bridge_slot_vertical_494_test.rs"
      - ".github/workflows/issue-598-focused.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Requires the repository runner's custom `guix` label; runner 21 was
# verified online with Guix installed before this gate was retriggered.
jobs:
  focused:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, guix]
    timeout-minutes: 20
    steps:
      - name: Require private dependency read token
        env:
          SENS_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
        run: test -n "$SENS_READ_TOKEN"

      - name: Checkout CML with pinned SENS
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
          submodules: true

      - name: Rustfmt changed Rust surfaces
        run: |
          guix shell --pure -m manifest.scm -- \
            rustfmt --edition 2024 --check --config skip_children=true \
              src/compiler_artifact.rs \
              tests/domain_bridge_slot_vertical_494_test.rs

      - name: Artifact provenance envelope unit tests
        run: guix shell --pure -m manifest.scm -- cargo test -p cml compiler_artifact::tests -- --nocapture

      - name: Full D3 compiler artifact provenance differential
        run: guix shell --pure -m manifest.scm -- cargo test -p cml --test domain_bridge_slot_vertical_494_test -- --nocapture
