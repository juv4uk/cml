name: Issue 191 Core profile request

on:
  pull_request:
    paths:
      - "src/core_profile.rs"
      - "src/lib.rs"
      - "tests/core_profile_request_test.rs"
      - ".github/workflows/issue-191-core-profile-request.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    name: Core profile request provenance
    runs-on: ubuntu-24.04
    steps:
      - name: Require private dependency read token
        env:
          SENS_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
        run: test -n "$SENS_READ_TOKEN"

      - name: Checkout CML with pinned my-lisp
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Run focused profile request witness
        run: cargo test --test core_profile_request_test -- --nocapture
