name: Replay 105 focused exact-rational x86 witness

on:
  pull_request:
    paths:
      - tests/exact_rational_x86_observed_current_red_test.rs
      - .github/workflows/replay-105-focused.yml

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/checkout@v5
        with:
          repository: juv4uk/my-lisp
          ref: d359c4885e0609a6c8350daf45de157b40cf48f3
          path: ../my-lisp
      - uses: dtolnay/rust-toolchain@stable
      - name: Focused exact-rational x86 witness
        run: cargo test --test exact_rational_x86_observed_current_red_test -- --nocapture
