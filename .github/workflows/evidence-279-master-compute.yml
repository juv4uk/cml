name: Evidence 279 master compute baseline

on:
  pull_request:
    paths:
      - .github/workflows/evidence-279-master-compute.yml

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Compute analysis baseline
        run: cargo test --test compute_analysis_test -- --nocapture
