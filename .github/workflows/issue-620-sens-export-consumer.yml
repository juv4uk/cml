name: GPU SENS compiler export consumer

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, guix]
    timeout-minutes: 30
    steps:
      - name: Require private dependency read token
        env:
          SENS_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
        run: test -n "$SENS_READ_TOKEN"

      - name: Checkout CML with pinned SENS
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
          submodules: true

      - name: Verify full-export SENS pin
        run: |
          test "$(git -C external/sens rev-parse HEAD)" = "c66d4743bb70882c75376dbcec27d393e5a9649d"
          grep -q '(build-source-sha . "c66d4743bb70882c75376dbcec27d393e5a9649d")' upstream-revisions.lisp
          grep -q '(supported-pin-sha . "c66d4743bb70882c75376dbcec27d393e5a9649d")' upstream-revisions.lisp
          grep -q '(observed-current-sha . "c66d4743bb70882c75376dbcec27d393e5a9649d")' upstream-revisions.lisp

      - name: Focused formatting
        run: >-
          guix shell --pure -m manifest.scm --
          rustfmt --edition 2024 --check
          src/sens_compiler_export.rs
          tests/sens_compiler_export_consumer_test.rs

      - name: Transport parser unit tests
        run: >-
          guix shell --pure -m manifest.scm --
          cargo test -j 1 -p cml --lib sens_compiler_export::tests -- --nocapture --test-threads=1

      - name: Verified rich admission regression
        run: >-
          guix shell --pure -m manifest.scm --
          cargo test -j 1 -p cml --lib sens_rich_bridge::tests -- --nocapture --test-threads=1

      - name: Real pinned exporter round-trip
        run: >-
          guix shell --pure -m manifest.scm --
          cargo test -j 1 -p cml --test sens_compiler_export_consumer_test -- --nocapture --test-threads=1
