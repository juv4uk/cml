name: Issue 494 exact D3 compiler vertical

on:
  pull_request:
    branches: [master]
    paths:
      - "src/ast.rs"
      - "src/lib.rs"
      - "src/lower.rs"
      - "src/macros.rs"
      - "src/parser.rs"
      - "src/sens_domain_bridge.rs"
      - "src/sens_slot_bridge.rs"
      - "tests/domain_bridge_slot_vertical_494_test.rs"
      - "external/sens"
      - "upstream-revisions.lisp"
      - ".github/workflows/issue-494-focused.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require private dependency read token
        env:
          SENS_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
        run: test -n "$SENS_READ_TOKEN"

      - name: Checkout CML with pinned SENS
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
          submodules: true

      - name: Rustfmt contract
        run: guix shell --pure -m manifest.scm -- cargo fmt -p cml -- --check

      - name: Proof-carrying domain bridge unit tests
        run: guix shell --pure -m manifest.scm -- cargo test -p cml sens_domain_bridge::tests -- --nocapture

      - name: Mechanical SLOT bridge unit tests
        run: guix shell --pure -m manifest.scm -- cargo test -p cml sens_slot_bridge::tests -- --nocapture

      - name: Exact SENS D3 evaluator-to-SLOT differential
        run: guix shell --pure -m manifest.scm -- cargo test -p cml --test domain_bridge_slot_vertical_494_test -- --nocapture
