name: Issue 282 focused compute MAP REDUCE Sid8 baseline

on:
  pull_request:
    paths:
      - build.rs
      - tests/compute_analysis_test.rs
      - .github/workflows/issue-282-focused.yml

jobs:
  focused:
    runs-on: [self-hosted, guix]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Format check
        run: cargo fmt -p cml -- --check
      - name: Compute analysis regression
        run: cargo test --test compute_analysis_test -- --nocapture
