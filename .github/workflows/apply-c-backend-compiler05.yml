name: Apply c_backend COMPILER-05 patches

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-c-backend-compiler05.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch c_backend.rs
        id: patch
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path('src/c_backend.rs')
          t = p.read_text()
          changed = False
          if 'NotCallable' not in t:
              t2 = t.replace(
                  'runtime_error("Type", "attempted to call a non-callable value");',
                  'runtime_error("NotCallable", "attempted to call a non-callable value");',
                  1,
              )
              if t2 != t:
                  t = t2
                  changed = True
                  print('applied NotCallable')
          if 'printed_result' not in t:
              a = t.find('        let mut main_body = String::new();')
              b = t.find('        Ok(format!(', a)
              if a < 0 or b < 0:
                  raise SystemExit('compile_program anchors missing')
              chunk = t[a:b]
              fmt_line = [l for l in chunk.splitlines(True) if 'print_value(result)' in l][0]
              new = (
                  '        let mut main_body = String::new();\n'
                  '        // my-lisp empty-program semantics (TASK-001 / 484cf619)\n'
                  '        let mut printed_result = false;\n'
                  '        for ir in program {\n'
                  '            match ir {\n'
                  '                Ir::Def { name, value } => {\n'
                  '                    main_body.push_str(&self.compile_def(name, value)?);\n'
                  '                }\n'
                  '                other => {\n'
                  '                    let expr = self.compile_expr(other, "global_env")?;\n'
                  '                    main_body.push_str(&format!(\n'
                  + fmt_line +
                  '                    ));\n'
                  '                    printed_result = true;\n'
                  '                }\n'
                  '            }\n'
                  '        }\n'
                  '        if !printed_result {\n'
                  '            main_body.push_str("    { print_value(&NIL_V); printf(\\"\\\\n\\"); }\\n");\n'
                  '        }\n'
                  '\n'
              )
              t = t[:a] + new + t[b:]
              changed = True
              print('applied empty-program')
          if not changed:
              print('already_applied')
              Path('/tmp/changed').write_text('false')
          else:
              p.write_text(t)
              assert 'NotCallable' in p.read_text()
              assert 'printed_result' in p.read_text()
              Path('/tmp/changed').write_text('true')
          PY
          echo "changed=$(cat /tmp/changed)" >> "$GITHUB_OUTPUT"
      - name: Commit
        if: steps.patch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/c_backend.rs
          git commit -m "fix(c-backend): NotCallable + empty-program () (COMPILER-05)"
          git push origin HEAD:master
