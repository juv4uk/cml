name: Issue 291 standard lowering SID8 guard

on:
  pull_request:
    paths:
      - tests/sid8_standard_lowering_guard_test.rs
      - src/lower.rs
      - .github/workflows/issue-291-focused.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Standard lowering SID8 guard
        run: cargo test --test sid8_standard_lowering_guard_test -- --nocapture
