name: Issue 291 delete legacy callable reifier

on:
  pull_request:
    paths:
      - src/lower.rs
      - src/build.rs
      - tests/c_backend_test.rs
      - tests/c_backend_conformance_test.rs
      - tests/exact_q_mul_upstream_execution_test.rs
      - tests/exact_rational_upstream_authority_test.rs
      - .github/workflows/issue-291-delete-reifier.yml

jobs:
  focused:
    runs-on: [self-hosted, guix]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Format check
        run: cargo fmt -p cml -- --check
      - name: Standard Sid8 lowering guard
        run: cargo test --test sid8_standard_lowering_guard_test -- --nocapture
      - name: C backend regression
        run: cargo test --test c_backend_test -- --nocapture
      - name: C backend conformance
        run: cargo test --test c_backend_conformance_test -- --nocapture
      - name: Exact-Q multiplication upstream execution
        run: cargo test --test exact_q_mul_upstream_execution_test -- --nocapture
      - name: Exact rational upstream authority
        run: cargo test --test exact_rational_upstream_authority_test -- --nocapture
