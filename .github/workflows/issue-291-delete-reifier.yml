name: Issue 291 delete legacy callable reifier

on:
  pull_request:
    paths:
      - src/lower.rs
      - src/build.rs
      - tests/c_backend_test.rs
      - tests/c_backend_conformance_test.rs
      - tests/exact_q_mul_upstream_execution_test.rs
      - tests/exact_rational_upstream_authority_test.rs
      - manifest.scm
      - .github/workflows/issue-291-delete-reifier.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
          submodules: recursive
      - name: Format check
        run: guix shell --pure -m manifest.scm -- cargo fmt -p cml -- --check
      - name: Standard Sid8 lowering guard
        run: guix shell --pure -m manifest.scm -- cargo test --test sid8_standard_lowering_guard_test -- --nocapture
      - name: C backend regression
        run: guix shell --pure -m manifest.scm -- cargo test --test c_backend_test -- --nocapture
      - name: C backend conformance
        run: guix shell --pure -m manifest.scm -- cargo test --test c_backend_conformance_test -- --nocapture
      - name: Exact-Q multiplication upstream execution
        run: guix shell --pure -m manifest.scm -- cargo test --test exact_q_mul_upstream_execution_test -- --nocapture
      - name: Exact rational upstream authority
        run: guix shell --pure -m manifest.scm -- cargo test --test exact_rational_upstream_authority_test -- --nocapture
