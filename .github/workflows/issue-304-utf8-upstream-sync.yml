name: Issue 304 repaired upstream UTF-8 closure

on:
  pull_request:
    paths:
      - external/sens
      - tests/utf8_decode_x86_replay_168_test.rs
      - .github/workflows/issue-304-utf8-upstream-sync.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Repaired upstream UTF-8 closure
        run: cargo test --test utf8_decode_x86_replay_168_test full_decoder_closure_state_is_recorded_honestly -- --exact --nocapture
