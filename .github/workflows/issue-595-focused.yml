name: Issue 595 full-source D3 compiler vertical

on:
  pull_request:
    paths:
      - "external/sens"
      - "upstream-revisions.lisp"
      - "src/compiler_mechanism.rs"
      - "src/sens_domain_bridge.rs"
      - "src/sens_slot_bridge.rs"
      - "tests/domain_bridge_slot_vertical_494_test.rs"
      - ".github/workflows/issue-595-focused.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Hosted native Rust semantics; exact Guix-pure reproducibility is NOT certified here.
      - uses: dtolnay/rust-toolchain@stable
      - name: Require private dependency read token
        env:
          SENS_READ_TOKEN: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
        run: test -n "$SENS_READ_TOKEN"

      - name: Checkout CML with pinned SENS
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_READ_TOKEN || secrets.SENS_READ_TOKEN }}
          submodules: true

      - name: Rustfmt contract
        run:  cargo fmt -p cml -- --check

      - name: Role to private mechanism mapping
        run:  cargo test -p cml compiler_mechanism::tests -- --nocapture

      - name: Proof-carrying request verification
        run:  cargo test -p cml sens_domain_bridge::tests -- --nocapture

      - name: Recursive canonical source to SLOT lowering
        run:  cargo test -p cml sens_slot_bridge::tests -- --nocapture

      - name: Full shared D3 corpus differential
        run:  cargo test -p cml --test domain_bridge_slot_vertical_494_test -- --nocapture
