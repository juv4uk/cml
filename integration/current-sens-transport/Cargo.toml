[package]
name = "cml-current-sens-transport"
version = "0.1.0"
edition = "2024"
publish = false

# Isolated candidate-only verifier for the modern SENS domain/transport API.
# Deliberately independent of the historical CML crate (which still uses
# removed Sid8 symbols). NOT a production dependency or alternate language law.
[dependencies]
sens = { path = "../../external/sens/crates/sens" }

# Exercise actual root CML LIR/backend mechanics against modern pinned SENS.
# Keep separate from the lib test harness: its imported root files contain
# unrelated historical unit tests that do not yet compile with current SENS.
[[bin]]
name = "verify_root_x86_lir"
path = "src/bin/verify_root_x86_lir.rs"
test = false
bench = false
