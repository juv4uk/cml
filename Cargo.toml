[package]
name = "cml"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"

[features]
default = []
# Opt-in proof on a separately pinned 11.8 candidate, never the production SENS gitlink.
core1-t5-candidate = []
gpu-wgpu = ["dep:pollster", "dep:wgpu"]
gpu-cuda = ["dep:cudarc"]

[dependencies]
cudarc = { version = "0.19.9", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12000"], optional = true }
pollster = { version = "1.0.1", optional = true }
wgpu = { version = "30.0.0", default-features = false, features = ["std", "wgsl", "vulkan", "gles"], optional = true }
wsm-os-target = { git = "https://github.com/juv4uk/wsm-target-contract.git", rev = "d3663026dbcce73e2b8e32238910c3f8f7dea833" }
sens = { path = "external/sens/crates/sens" }

[dev-dependencies]
# #84 supported-pin channel:
# cml's tests read sens's own .lisp source tree directly (the encoder
# bridge triple-oracle check, CPU profile contracts, conformance fixtures)
# in addition to its Rust API. This contract dependency is resolved from
# external/sens; observed-current is evidence/drift input, not Cargo authority.
sens = { path = "external/sens/crates/sens" }

[[test]]
name = "core1_t5_to_native_test"
path = "tests/core1_t5_to_native_test.rs"
required-features = ["core1-t5-candidate"]
