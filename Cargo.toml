[package]
name = "cml"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"

[features]
default = []
gpu-wgpu = ["dep:pollster", "dep:wgpu"]
gpu-cuda = ["dep:cudarc"]

[dependencies]
cudarc = { version = "0.19.9", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12000"], optional = true }
pollster = { version = "1.0.1", optional = true }
wgpu = { version = "30.0.0", default-features = false, features = ["std", "wgsl", "vulkan", "gles"], optional = true }
wsm-os-target = { git = "https://github.com/juv4uk/wsm-target-contract.git", rev = "7b47a8dcc2da8e05d60b0ed1177ef6f9e55c081d" }

[dev-dependencies]
# #84 supported-pin channel:
# cml's tests read my-lisp's own .lisp source tree directly (the encoder
# bridge triple-oracle check, CPU profile contracts, conformance fixtures)
# in addition to its Rust API. This contract dependency is resolved from
# external/my-lisp; observed-current is evidence/drift input, not Cargo authority.
my-lisp = { path = "external/my-lisp/crates/my-lisp" }
